# Signed S1 frame release on a frame tag (docs/releasing.md "Frame releases", #139):
#   git tag frames/aqara-s1-plus/v1.2.3 && git push origin frames/aqara-s1-plus/v1.2.3
# Builds and signs the S1's frame bundle (frames/aqara-s1-plus/research/frame-loader.md): the service
# scripts (the frame agent's among them), otbr-agent/ot-ctl, the setup hotspot's name overlay, the Silicon
# Labs Zigbee runtime (never Silicon Labs' zigbeed itself) and the boot animation. Publishes it as frame-bundle-aqara-s1-plus-<version>.zip with a .sha256 on a GitHub
# Release, --latest=false (panels on 0.4.3 read only releases/latest), with notes from
# frames/aqara-s1-plus/FRAME-CHANGELOG.md. The app finds it through its Frame update entity.
#
# The bundle key lets code run as root on every S1 with the loader, so it is kept apart as in release.yml:
#   inputs       builds the Silicon Labs runtime (no secrets); its output must match the committed
#                frames/aqara-s1-plus/tools/radio/sisdk-runtime.sha256
#   sign-bundle  the only job that can read S1_RADIO_BUNDLE_KEY (an environment secret of the
#                `radio-signing` environment). Signs only commits on main, takes nothing from the other
#                job without checking it against committed hashes, runs no third-party action but the
#                artifact ones
#   publish      creates the release (contents: write; no key)
# Every action is pinned by commit SHA (the tag in the comment is what it was at the time).
name: Frame release

on:
  push:
    tags: ['frames/aqara-s1-plus/v*']

permissions:
  contents: read

concurrency:
  group: frame-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Version from the tag
        id: version
        run: |
          v="${GITHUB_REF_NAME#frames/aqara-s1-plus/v}"
          # The loader's rule (glassworks_loader.sh semver): MAJOR.MINOR.PATCH, each 0..999, no leading zeros.
          if ! [[ "$v" =~ ^(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})$ ]] || [ "$v" = 0.0.0 ]; then
            echo "::error::tag $GITHUB_REF_NAME is not frames/aqara-s1-plus/vMAJOR.MINOR.PATCH (each 0..999)"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Release notes from frames/aqara-s1-plus/FRAME-CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: tools/release/changelog-section.sh "$VERSION" frames/aqara-s1-plus/FRAME-CHANGELOG.md

      - name: Silicon Labs runtime (no zigbeed), checked against frames/aqara-s1-plus/tools/radio/sisdk-runtime.sha256
        run: frames/aqara-s1-plus/tools/radio/build-sisdk-runtime.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sisdk-runtime
          path: frames/aqara-s1-plus/tools/radio/out/sisdk/
          if-no-files-found: error
          retention-days: 7   # long enough to rerun a failed later job (Re-run failed jobs)

  sign-bundle:
    needs: inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: radio-signing
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Only commits on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main ||
            { echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main: refusing to sign a frame bundle"; exit 1; }

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sisdk-runtime
          path: ${{ runner.temp }}/sisdk

      - name: Check every input against what is committed
        run: |
          # The runtime: exactly the committed file list and hashes (artifacts don't keep file modes;
          # they are set here, not taken from the other job).
          cd "$RUNNER_TEMP/sisdk"
          find . -type f | LC_ALL=C sort | xargs sha256sum > "$RUNNER_TEMP/sisdk.sha256"
          diff "$RUNNER_TEMP/sisdk.sha256" "$GITHUB_WORKSPACE/frames/aqara-s1-plus/tools/radio/sisdk-runtime.sha256" ||
            { echo "::error::the Silicon Labs runtime does not match frames/aqara-s1-plus/tools/radio/sisdk-runtime.sha256"; exit 1; }
          find . -type f -exec chmod 0644 {} +
          chmod 0755 zigbeed.sh lib/ld-linux-armhf.so.3
          # otbr-agent/ot-ctl: the pinned border-router build the web installer ships (kiln/assets.lock.json).
          cd "$GITHUB_WORKSPACE"; mkdir -p "$RUNNER_TEMP/radio-in"
          python3 - "$RUNNER_TEMP/radio-in" <<'PY'
          import hashlib, json, sys, urllib.request
          out = sys.argv[1]
          for a in json.load(open('kiln/assets.lock.json'))['assets']:
              if a['name'] not in ('otbr-agent', 'ot-ctl'):
                  continue
              data = urllib.request.urlopen(a['url']).read()
              h = hashlib.sha256(data).hexdigest()
              if h != a['sha256']:
                  sys.exit(f"{a['name']}: sha256 {h}, expected {a['sha256']}")
              open(f"{out}/{a['name']}", 'wb').write(data)
              print(a['name'], len(data), h)
          PY

      # The S1's setup hotspot name (#197): a one-string resource overlay, built here from the committed sources
      # with the runner's Android SDK, as release.yml does (a key made for this build signs it; the bundle's
      # signature is what the panel trusts). No third-party action: the runner image's SDK.
      - name: Hotspot name overlay
        run: |
          [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME" ] ||
            { echo "::error::ANDROID_HOME is not set or missing: the runner image's Android SDK builds the hotspot name overlay"; exit 1; }
          ls "$ANDROID_HOME"/build-tools/*/aapt2 "$ANDROID_HOME"/build-tools/*/apksigner >/dev/null 2>&1 ||
            { echo "::error::no build-tools with aapt2 and apksigner under $ANDROID_HOME"; exit 1; }
          ls "$ANDROID_HOME"/platforms/android-*/android.jar >/dev/null 2>&1 ||
            { echo "::error::no platform android.jar under $ANDROID_HOME"; exit 1; }
          frames/aqara-s1-plus/tools/radio/hotspot-name/build.sh "$RUNNER_TEMP/radio-in"

      - name: Sign the frame bundle
        env:
          VERSION: ${{ needs.inputs.outputs.version }}
          S1_RADIO_BUNDLE_KEY: ${{ secrets.S1_RADIO_BUNDLE_KEY }}
        run: |
          [ -n "$S1_RADIO_BUNDLE_KEY" ] || { echo "::error::secret S1_RADIO_BUNDLE_KEY is not set in the radio-signing environment (docs/releasing.md)"; exit 1; }
          umask 077
          printf '%s\n' "$S1_RADIO_BUNDLE_KEY" > "$RUNNER_TEMP/frame-bundle.pem"
          # The manifest's "created" is the tagged commit's time, so a rebuild gives the same bytes but for
          # hotspot-name.apk, which build.sh signs with a key made for each build.
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) frames/aqara-s1-plus/tools/radio/frame-bundle.sh "$VERSION" "$RUNNER_TEMP/frame-bundle.pem" "$RUNNER_TEMP/signed" \
            "$RUNNER_TEMP/radio-in" "$RUNNER_TEMP/sisdk" frames/aqara-s1-plus/tools/root/glassworks_bundle.pub
          mkdir -p "$RUNNER_TEMP/dist"
          cp "$RUNNER_TEMP/signed/frame-bundle-aqara-s1-plus-$VERSION.zip" "$RUNNER_TEMP/dist/"
          (cd "$RUNNER_TEMP/dist" && sha256sum "frame-bundle-aqara-s1-plus-$VERSION.zip" > "frame-bundle-aqara-s1-plus-$VERSION.zip.sha256")

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/frame-bundle.pem"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frame-bundle
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 7   # long enough to rerun a failed later job (Re-run failed jobs)

  publish:
    needs: [inputs, sign-bundle]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: The tag still names the commit this run built
        # gh release create names the tag, not a commit: if the tag moved while the run waited, the bundle
        # built here would be published on another commit's tag.
        run: |
          now=$(git ls-remote origin "refs/tags/$GITHUB_REF_NAME^{}" "refs/tags/$GITHUB_REF_NAME" | awk 'NR==1 || /\^\{\}$/ {c=$1} END {print c}')
          [ "$now" = "$GITHUB_SHA" ] ||
            { echo "::error::$GITHUB_REF_NAME now points at ${now:-nothing}, not $GITHUB_SHA: refusing to publish"; exit 1; }

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: frame-bundle
          path: dist

      - name: Publish the release
        env:
          VERSION: ${{ needs.inputs.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tools/release/changelog-section.sh "$VERSION" frames/aqara-s1-plus/FRAME-CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          (cd dist && sha256sum -c "frame-bundle-aqara-s1-plus-$VERSION.zip.sha256")
          # A re-run after a publish that went through, or stopped as a draft, without being recorded. Every
          # file it holds must be one of these (the tag was checked above), else it is refused. A draft gets
          # the files it lacks and is published; a published release must already hold all of them.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft) ||
              { echo "::error::cannot read whether $GITHUB_REF_NAME is a draft"; exit 1; }
            # A failed upload can leave an empty placeholder asset in the "starter" state: a draft's are
            # deleted (the files are uploaded again below), a published release with one is refused.
            assets() {   # "<name> <state>" per asset; the step stops when GitHub can't be asked
              gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[] | "\(.name) \(.state)"' ||
                { echo "::error::cannot list the assets of $GITHUB_REF_NAME"; exit 1; }
            }
            all=$(assets)
            starters=$(printf '%s\n' "$all" | awk 'NF == 2 && $2 != "uploaded" {print $1}')
            if [ -n "$starters" ]; then
              [ "$draft" = true ] || { echo "::error::$GITHUB_REF_NAME is published with unfinished uploads: $starters"; exit 1; }
              for a in $starters; do gh release delete-asset "$GITHUB_REF_NAME" "$a" --yes; done
            fi
            have() {   # the uploaded assets, downloaded by name, with their SHA-256
              rm -rf "$RUNNER_TEMP/published"; mkdir -p "$RUNNER_TEMP/published"
              all=$(assets)
              for a in $(printf '%s\n' "$all" | awk 'NF == 2 && $2 == "uploaded" {print $1}'); do
                gh release download "$GITHUB_REF_NAME" --pattern "$a" --dir "$RUNNER_TEMP/published"
              done
              (cd "$RUNNER_TEMP/published" && find . -type f -printf '%P\n' | LC_ALL=C sort | xargs -r sha256sum --)
            }
            (cd dist && find . -type f -printf '%P\n' | LC_ALL=C sort | xargs sha256sum --) > "$RUNNER_TEMP/want"
            have > "$RUNNER_TEMP/have"
            extra=$(LC_ALL=C comm -13 <(LC_ALL=C sort "$RUNNER_TEMP/want") <(LC_ALL=C sort "$RUNNER_TEMP/have"))
            [ -z "$extra" ] || { echo "::error::$GITHUB_REF_NAME already holds other files: refusing to touch it"; echo "$extra"; exit 1; }
            case "$draft" in
              true)
                for f in dist/*; do
                  [ -e "$RUNNER_TEMP/published/${f#dist/}" ] || gh release upload "$GITHUB_REF_NAME" "$f"
                done
                have > "$RUNNER_TEMP/have"
                diff "$RUNNER_TEMP/want" "$RUNNER_TEMP/have" || { echo "::error::the draft's files still differ"; exit 1; }
                all=$(assets)
                [ -z "$(printf '%s\n' "$all" | awk 'NF == 2 && $2 != "uploaded"')" ] ||
                  { echo "::error::the draft has unfinished uploads again: not publishing it"; exit 1; }
                gh release edit "$GITHUB_REF_NAME" --draft=false --latest=false \
                  --title "Aqara S1 Plus frame $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
                echo "$GITHUB_REF_NAME was a draft: completed and published"; exit 0 ;;
              false)
                diff "$RUNNER_TEMP/want" "$RUNNER_TEMP/have" ||
                  { echo "::error::$GITHUB_REF_NAME is published without all of these files"; exit 1; }
                echo "$GITHUB_REF_NAME is already published with these files"; exit 0 ;;
              *) echo "::error::unexpected draft state '$draft'"; exit 1 ;;
            esac
          fi
          # --latest=false: apps up to 0.4.3 read only releases/latest, which must stay S1 Kiosk's.
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --latest=false \
            --title "Aqara S1 Plus frame $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
