# Deploys glassworks.dev (site/) and Kiln (kiln.glassworks.dev, kiln/apps/kiln) to Vercel production from main.
#
# Vercel's Git builds are off for both projects (git.deploymentEnabled false in their vercel.json), so a push
# deploys nothing on its own. This workflow does it instead:
#   - on a push to main, each project whose inputs changed since its last successful deploy (below);
#   - every 6 hours, the same, so a deploy that failed (Vercel's daily cap) or was cancelled is tried again
#     without a push. Nothing deploys when nothing changed since the last successful deploy;
#   - by hand from the Actions tab (workflow_dispatch), for one project or both.
#
# tools/ci/web_deploy.py decides. Each job records its upload as a GitHub deployment (task web-deploy) of the commit
# it checked out, started before the upload and marked success once Vercel took it. A project's base is the newest
# record that reached success, not the push's `before`: a change whose deploy was cancelled or failed still deploys
# on the next push or schedule, and so does a project with a newer record that never reached success. Without a
# base it deploys (a schedule, when GitHub's API fails, doesn't).
#
# glassworks.dev is built here and uploaded prebuilt (vercel build, then vercel deploy --prebuilt). Its build on
# Vercel's own machines fails at the Pagefind step, because the newer Vercel CLI there moves Next's output away
# from .next/server/app before Pagefind reads it ("no html files"). The CLI is pinned to the one this build
# works with. Kiln builds on Vercel as before (vercel deploy, kiln/apps/kiln/vercel.json's commands).
#
# What triggers each project:
#   - site: tools/ci/changes.py's `site` rule, the same one pr.yml's site job runs on (or every job's paths);
#   - kiln: KILN in tools/ci/web_deploy.py, the app's npm workspaces and the repo files its build stages.
#   - installer: kiln/s1-redirect, the redirect s1.edm.sh serves (the first installer's address, now Kiln's S1 page).
#
# Secrets: VERCEL_SITE_TOKEN, VERCEL_KILN_TOKEN and VERCEL_INSTALLER_TOKEN, one Vercel token per project. Variables:
# VERCEL_ORG_ID, VERCEL_SITE_PROJECT_ID, VERCEL_KILN_PROJECT_ID, VERCEL_INSTALLER_PROJECT_ID. A missing one fails the job, so a deploy never skips silently.
name: Web deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:
    inputs:
      project:
        description: What to deploy
        type: choice
        options: [both, site, kiln, installer]   # both: site and kiln
        default: both

permissions:
  contents: read
  deployments: read   # each project's last recorded deploy (tools/ci/web_deploy.py)

# Bash with pipefail: a picker that fails fails its step, though tee copies its output.
defaults:
  run:
    shell: bash

env:
  VERCEL_CLI: vercel@65.14.0

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      site: ${{ steps.pick.outputs.site }}
      kiln: ${{ steps.pick.outputs.kiln }}
      installer: ${{ steps.pick.outputs.installer }}
    steps:
      # Full history without file contents: the base can be any number of commits back.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none

      - name: Pick the projects
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          PROJECT: ${{ inputs.project }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 tools/ci/web_deploy.py pick --event "$EVENT" --project "${PROJECT:-both}" \
            --summary "$GITHUB_STEP_SUMMARY" | tee -a "$GITHUB_OUTPUT"

  site:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    # One deploy per project at a time, and a running one is never cancelled: Vercel counts it against the free
    # plan's daily cap even then. A newer run waits (GitHub keeps only the newest waiting one), then checks out the
    # newest main and deploys only if something it builds from changed since the deploy before it.
    permissions:
      contents: read
      deployments: write   # the record of what it deployed
    concurrency:
      group: web-deploy-site
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: glassworks.dev
      url: https://www.glassworks.dev
    steps:
      # The branch, not the pushed commit: a job that waited for the one before it deploys the newest main, which
      # has every change the runs it replaced had. The check below makes sure it has this run's commit.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
          # The docs' dates come from git history at build time.
          fetch-depth: 0

      - name: Check it still needs a deploy
        id: check
        env:
          EVENT: ${{ github.event_name }}
          STARTED_FOR: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 tools/ci/web_deploy.py check site --event "$EVENT" --started-for "$STARTED_FOR" \
            --summary "$GITHUB_STEP_SUMMARY" | tee -a "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.check.outputs.deploy == 'true'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Check the token and the project
        if: steps.check.outputs.deploy == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_SITE_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_SITE_PROJECT_ID }}
        run: |
          for v in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!v}" ]; then echo "::error::$v is not set: glassworks.dev was not deployed"; exit 1; fi
          done

      # Prerendering /blueprints reads GitHub's API, and a dropped connection there ("fetch failed") fails a build
      # now and then (pr.yml's site job). Then it builds once more; any other failure fails.
      - name: Build as Vercel production
        if: steps.check.outputs.deploy == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_SITE_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_SITE_PROJECT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          npx -y "$VERCEL_CLI" pull --yes --environment=production --token "$VERCEL_TOKEN" > /dev/null
          log="$RUNNER_TEMP/site-build.log"
          if npx -y "$VERCEL_CLI" build --prod --token "$VERCEL_TOKEN" 2>&1 | tee "$log"; then exit 0; fi
          grep -q 'fetch failed' "$log" || exit 1
          echo "::warning::The site build lost a connection to GitHub's API (fetch failed). Building once more."
          npx -y "$VERCEL_CLI" build --prod --token "$VERCEL_TOKEN"

      # Before the upload: if the job stops after Vercel took it, this record says the live commit is unknown.
      - name: Record the deploy as started
        id: start
        if: steps.check.outputs.deploy == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.check.outputs.commit }}
        run: python3 tools/ci/web_deploy.py start site --commit "$COMMIT" | tee -a "$GITHUB_OUTPUT"

      # One archive: the free plan also caps file uploads a day.
      - name: Deploy the build to production
        if: steps.check.outputs.deploy == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_SITE_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_SITE_PROJECT_ID }}
          COMMIT: ${{ steps.check.outputs.commit }}
        run: |
          url=$(npx -y "$VERCEL_CLI" deploy --prebuilt --prod --archive=tgz --token "$VERCEL_TOKEN")
          echo "Deployed: $url, from main at $COMMIT" | tee -a "$GITHUB_STEP_SUMMARY"

      # Success makes this commit the next run's base. Without it (a failed upload, or a job cancelled or timed out
      # before here) the record stays unsettled, and the next push or schedule deploys again.
      - name: Record the deploy as done
        if: steps.check.outputs.deploy == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ID: ${{ steps.start.outputs.id }}
        run: python3 tools/ci/web_deploy.py finish site --id "$ID" --state success

      - name: Record the deploy as failed
        if: failure() && steps.start.outputs.id != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ID: ${{ steps.start.outputs.id }}
        run: python3 tools/ci/web_deploy.py finish site --id "$ID" --state failure

  kiln:
    needs: changes
    if: needs.changes.outputs.kiln == 'true'
    # One deploy per project at a time, and a running one is never cancelled: Vercel counts it against the free
    # plan's daily cap even then. A newer run waits (GitHub keeps only the newest waiting one), then checks out the
    # newest main and deploys only if something it builds from changed since the deploy before it.
    permissions:
      contents: read
      deployments: write   # the record of what it deployed
    concurrency:
      group: web-deploy-kiln
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: kiln.glassworks.dev
      url: https://kiln.glassworks.dev
    steps:
      # The branch, not the pushed commit: a job that waited for the one before it deploys the newest main, which
      # has every change the runs it replaced had. The check below makes sure it has this run's commit.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
          fetch-depth: 0       # the check's diff from the last deploy
          filter: blob:none

      - name: Check it still needs a deploy
        id: check
        env:
          EVENT: ${{ github.event_name }}
          STARTED_FOR: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 tools/ci/web_deploy.py check kiln --event "$EVENT" --started-for "$STARTED_FOR" \
            --summary "$GITHUB_STEP_SUMMARY" | tee -a "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.check.outputs.deploy == 'true'
        with:
          node-version: '24'

      # Before the upload: if the job stops after Vercel took it, this record says the live commit is unknown.
      - name: Record the deploy as started
        id: start
        if: steps.check.outputs.deploy == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.check.outputs.commit }}
        run: python3 tools/ci/web_deploy.py start kiln --commit "$COMMIT" | tee -a "$GITHUB_OUTPUT"

      # Vercel builds it from the uploaded repo with kiln/apps/kiln/vercel.json's commands (the project's root
      # directory is kiln/apps/kiln), and waits until the deployment is ready or fails.
      - name: Deploy to production
        if: steps.check.outputs.deploy == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_KILN_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_KILN_PROJECT_ID }}
          COMMIT: ${{ steps.check.outputs.commit }}
        run: |
          for v in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!v}" ]; then echo "::error::$v is not set: Kiln was not deployed"; exit 1; fi
          done
          url=$(npx -y "$VERCEL_CLI" deploy --prod --archive=tgz --token "$VERCEL_TOKEN")
          echo "Deployed: $url, from main at $COMMIT" | tee -a "$GITHUB_STEP_SUMMARY"

      # Success makes this commit the next run's base. Without it (a failed upload, or a job cancelled or timed out
      # before here) the record stays unsettled, and the next push or schedule deploys again.
      - name: Record the deploy as done
        if: steps.check.outputs.deploy == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ID: ${{ steps.start.outputs.id }}
        run: python3 tools/ci/web_deploy.py finish kiln --id "$ID" --state success

      - name: Record the deploy as failed
        if: failure() && steps.start.outputs.id != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ID: ${{ steps.start.outputs.id }}
        run: python3 tools/ci/web_deploy.py finish kiln --id "$ID" --state failure

  # s1.edm.sh, the first installer's address, only redirects to Kiln's S1 page: kiln/s1-redirect/vercel.json, which
  # forwards every path (and so old #/wifi links, which Kiln's S1 page maps). The project's root directory is kiln/,
  # so the folder goes up as kiln/ in an upload of its own, with nothing to build.
  installer:
    needs: changes
    if: needs.changes.outputs.installer == 'true'
    permissions:
      contents: read
      deployments: write   # the record of what it deployed
    concurrency:   # as the site's and Kiln's
      group: web-deploy-installer
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: s1.edm.sh
      url: https://s1.edm.sh
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
          fetch-depth: 0       # the check's diff from the last deploy
          filter: blob:none

      - name: Check it still needs a deploy
        id: check
        env:
          EVENT: ${{ github.event_name }}
          STARTED_FOR: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 tools/ci/web_deploy.py check installer --event "$EVENT" --started-for "$STARTED_FOR" \
            --summary "$GITHUB_STEP_SUMMARY" | tee -a "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.check.outputs.deploy == 'true'
        with:
          node-version: '24'

      # Before the upload: if the job stops after Vercel took it, this record says the live commit is unknown.
      - name: Record the deploy as started
        id: start
        if: steps.check.outputs.deploy == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.check.outputs.commit }}
        run: python3 tools/ci/web_deploy.py start installer --commit "$COMMIT" | tee -a "$GITHUB_OUTPUT"

      - name: Deploy the redirect to production
        if: steps.check.outputs.deploy == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_INSTALLER_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_INSTALLER_PROJECT_ID }}
          COMMIT: ${{ steps.check.outputs.commit }}
        run: |
          for v in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!v}" ]; then echo "::error::$v is not set: s1.edm.sh was not deployed"; exit 1; fi
          done
          up="$RUNNER_TEMP/s1-redirect"
          mkdir -p "$up"
          cp -R kiln/s1-redirect "$up/kiln"
          cd "$up"
          url=$(npx -y "$VERCEL_CLI" deploy --prod --archive=tgz --token "$VERCEL_TOKEN")
          echo "Deployed: $url, from main at $COMMIT" | tee -a "$GITHUB_STEP_SUMMARY"

      # Success makes this commit the next run's base. Without it (a failed upload, or a job cancelled or timed out
      # before here) the record stays unsettled, and the next push or schedule deploys again.
      - name: Record the deploy as done
        if: steps.check.outputs.deploy == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ID: ${{ steps.start.outputs.id }}
        run: python3 tools/ci/web_deploy.py finish installer --id "$ID" --state success

      - name: Record the deploy as failed
        if: failure() && steps.start.outputs.id != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ID: ${{ steps.start.outputs.id }}
        run: python3 tools/ci/web_deploy.py finish installer --id "$ID" --state failure
