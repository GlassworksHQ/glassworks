# Signed kiosk release on a version tag (docs/releasing.md):
#   git tag -a aqara-s1-plus-v1.2.3 -m "Glassworks 1.2.3" && git push origin aqara-s1-plus-v1.2.3
# A beta (#605): the same tag with the line "Channel: beta" in its message (-m "Channel: beta"), published as a
# GitHub pre-release that only panels on the Beta update channel take (tools/release/tag-channel.sh).
# Builds :kiosk (frames/aqara-s1-plus/android) once per ABI with the release key (secrets of the `release-signing` environment),
# names the APKs s1-kiosk-<version>.apk (armeabi-v7a, the S1's; never rename it) and
# s1-kiosk-arm64-v8a-<version>.apk, writes a .sha256 for each and publishes all four on a GitHub
# Release with notes from CHANGELOG.md. Every ABI's APK has the same versionCode (docs/releasing.md
# "ABIs"). Panels find theirs through the app's update entity in Home Assistant.
#
# The APK carries the signed radio bundle (frames/aqara-s1-plus/docs/radio.md "Radio bundles"): the radio helper,
# otbr-agent/ot-ctl and the Silicon Labs Zigbee runtime (never Silicon Labs' zigbeed itself). Its key
# lets code run as root on every panel, so it is kept away from everything else:
#   inputs       builds the Silicon Labs runtime (no secrets); its output must match the committed
#                frames/aqara-s1-plus/tools/radio/sisdk-runtime.sha256
#   sign-bundle  the only job that can read S1_RADIO_BUNDLE_KEY (an environment secret of the
#                `radio-signing` environment). Signs only commits on main, takes nothing from the other
#                job without checking it against committed hashes, runs no third-party action
#   release      builds and publishes the APKs, the armeabi-v7a one with the signed bundle (APK key
#                from the `release-signing` environment; no bundle key). The bundle is the S1's root
#                side, so the arm64-v8a APK, which no S1 runs, carries none
# Every action is pinned by commit SHA (the tag in the comment is what it was at the time).
name: Release

on:
  push:
    tags: ['v*', 'aqara-s1-plus-v*']   # aqara-s1-plus-v*: the app's own prefix once the repo holds other frames

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.channel.outputs.channel }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Version from the tag
        id: version
        run: |
          v="${GITHUB_REF_NAME#aqara-s1-plus-}"
          v="${v#v}"
          # Same rule as frames/aqara-s1-plus/android/build.gradle.kts: MAJOR.MINOR.PATCH, minor and patch below 100.
          # No SemVer pre-release tags (v1.2.3-rc.1): they have no versionCode. A beta is a plain version (Channel: beta).
          if ! [[ "$v" =~ ^(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)$ ]]; then
            echo "::error::tag $GITHUB_REF_NAME is not [aqara-s1-plus-]vMAJOR.MINOR.PATCH (minor/patch < 100)"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Channel from the tag's message (stable, or beta)
        id: channel
        run: |
          # actions/checkout can leave a lightweight copy of an annotated tag: fetch the tag itself.
          git fetch --no-tags --force origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          channel="$(tools/release/tag-channel.sh "$GITHUB_REF_NAME")"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "$GITHUB_REF_NAME: $channel"

      - name: Higher than the S1 app's last release or beta
        # A stable can't go out below a published beta: panels on Beta would never be offered it (#605).
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: tools/release/check-newer-than-released.sh aqara-s1-plus "$VERSION"

      - name: Release notes from CHANGELOG.md
        # Every release needs its section in CHANGELOG.md; checked before the slow build.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tools/release/changelog-section.sh "$VERSION" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Silicon Labs runtime (no zigbeed), checked against frames/aqara-s1-plus/tools/radio/sisdk-runtime.sha256
        run: frames/aqara-s1-plus/tools/radio/build-sisdk-runtime.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sisdk-runtime
          path: frames/aqara-s1-plus/tools/radio/out/sisdk/
          if-no-files-found: error
          retention-days: 1

  sign-bundle:
    needs: inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: radio-signing
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Only commits on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main ||
            { echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main: refusing to sign a radio bundle"; exit 1; }

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sisdk-runtime
          path: ${{ runner.temp }}/sisdk

      - name: Check every input against what is committed
        run: |
          # The runtime: exactly the committed file list and hashes (artifacts don't keep file modes;
          # they are set here, not taken from the other job).
          cd "$RUNNER_TEMP/sisdk"
          find . -type f | LC_ALL=C sort | xargs sha256sum > "$RUNNER_TEMP/sisdk.sha256"
          diff "$RUNNER_TEMP/sisdk.sha256" "$GITHUB_WORKSPACE/frames/aqara-s1-plus/tools/radio/sisdk-runtime.sha256" ||
            { echo "::error::the Silicon Labs runtime does not match frames/aqara-s1-plus/tools/radio/sisdk-runtime.sha256"; exit 1; }
          find . -type f -exec chmod 0644 {} +
          chmod 0755 zigbeed.sh lib/ld-linux-armhf.so.3
          # otbr-agent/ot-ctl: the pinned border-router build the web installer ships (kiln/assets.lock.json).
          cd "$GITHUB_WORKSPACE"; mkdir -p "$RUNNER_TEMP/radio-in"
          python3 - "$RUNNER_TEMP/radio-in" <<'PY'
          import hashlib, json, sys, urllib.request
          out = sys.argv[1]
          for a in json.load(open('kiln/assets.lock.json'))['assets']:
              if a['name'] not in ('otbr-agent', 'ot-ctl'):
                  continue
              data = urllib.request.urlopen(a['url']).read()
              h = hashlib.sha256(data).hexdigest()
              if h != a['sha256']:
                  sys.exit(f"{a['name']}: sha256 {h}, expected {a['sha256']}")
              open(f"{out}/{a['name']}", 'wb').write(data)
              print(a['name'], len(data), h)
          PY

      # The S1's setup hotspot name (#197): a one-string resource overlay, built here from the committed sources
      # with the runner's Android SDK (a key made for this build signs it; the bundle's signature is what counts).
      - name: Hotspot name overlay
        run: |
          # This job has no setup-android: the runner image's SDK builds the overlay. Say so plainly if it's gone.
          [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME" ] ||
            { echo "::error::ANDROID_HOME is not set or missing: the runner image's Android SDK builds the hotspot name overlay"; exit 1; }
          ls "$ANDROID_HOME"/build-tools/*/aapt2 "$ANDROID_HOME"/build-tools/*/apksigner >/dev/null 2>&1 ||
            { echo "::error::no build-tools with aapt2 and apksigner under $ANDROID_HOME"; exit 1; }
          ls "$ANDROID_HOME"/platforms/android-*/android.jar >/dev/null 2>&1 ||
            { echo "::error::no platform android.jar under $ANDROID_HOME"; exit 1; }
          frames/aqara-s1-plus/tools/radio/hotspot-name/build.sh "$RUNNER_TEMP/hotspot-name"

      - name: Sign the radio bundle
        env:
          VERSION: ${{ needs.inputs.outputs.version }}
          S1_RADIO_BUNDLE_KEY: ${{ secrets.S1_RADIO_BUNDLE_KEY }}
        run: |
          [ -n "$S1_RADIO_BUNDLE_KEY" ] || { echo "::error::secret S1_RADIO_BUNDLE_KEY is not set in the radio-signing environment (docs/releasing.md)"; exit 1; }
          umask 077
          printf '%s\n' "$S1_RADIO_BUNDLE_KEY" > "$RUNNER_TEMP/radio-bundle.pem"
          IFS=. read -r major minor patch <<< "$VERSION"
          code=$((major * 10000 + minor * 100 + patch))   # = the APK's versionCode: only ever goes up
          # The boot writer (#139, route 2): a 0.4.3 boot image gets the frame loader from this bundle, over the air
          frames/aqara-s1-plus/tools/root/bootwriter-files.sh "$RUNNER_TEMP/bootwriter"
          python3 frames/aqara-s1-plus/tools/radio/make-bundle.py --version "$code" --app-version "$VERSION" \
            --key "$RUNNER_TEMP/radio-bundle.pem" \
            --out "$RUNNER_TEMP/signed" --pubkey frames/aqara-s1-plus/tools/root/glassworks_bundle.pub \
            --file s1kiosk_radio.sh=frames/aqara-s1-plus/tools/radio/s1kiosk_radio.sh:0700 \
            --file "otbr-agent=$RUNNER_TEMP/radio-in/otbr-agent:0700" \
            --file "ot-ctl=$RUNNER_TEMP/radio-in/ot-ctl:0700" \
            --file "hotspot-name.apk=$RUNNER_TEMP/hotspot-name/hotspot-name.apk:0644" \
            --dir "bootwriter=$RUNNER_TEMP/bootwriter" \
            --dir "sisdk=$RUNNER_TEMP/sisdk"

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/radio-bundle.pem"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: radio-bundle
          path: ${{ runner.temp }}/signed/
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [inputs, sign-bundle]
    runs-on: ubuntu-24.04
    # The APK key lives in this environment, not in repository secrets, so only main, test-build/**
    # and release tags can reach it, never a workflow on some other branch (docs/releasing.md).
    environment: release-signing
    timeout-minutes: 60   # two APK builds
    # One S1 release at a time, whatever its tag (v*, aqara-s1-plus-v*, stable or beta): each checks its version again
    # just before it publishes, so two tags pushed together can't publish out of order (#605).
    concurrency:
      group: release-publish-aqara-s1-plus
      cancel-in-progress: false
    permissions:
      contents: write # create the release and upload its assets (GITHUB_TOKEN only)
    env:
      VERSION: ${{ needs.inputs.outputs.version }}
      CHANNEL: ${{ needs.inputs.outputs.channel }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: ABIs, one APK each (every frame's abis, tools/release/frame-abis.sh)
        run: |
          abis="$(tools/release/frame-abis.sh)"
          echo "ABIS=$abis" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: radio-bundle
          path: ${{ runner.temp }}/radio-bundle-assets

      - name: Radio bundle for the APK
        run: |
          echo "S1_RADIO_BUNDLE_ASSETS=$RUNNER_TEMP/radio-bundle-assets" >> "$GITHUB_ENV"
          tools/release/changelog-section.sh "$VERSION" > "$RUNNER_TEMP/notes.md"

      # AGP 9.3 / Gradle 9.8 / Kotlin 2.4 (build.gradle.kts, gradle-wrapper.properties) need JDK 17+;
      # the app is developed on Temurin 21.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          # The default ("tools platform-tools") fails: current sdkmanager has no "tools" package.
          packages: platform-tools

      # compileSdk 37.2 (frames/aqara-s1-plus/android/build.gradle.kts: release(37) { minorApiLevel = 2 }); AGP fetches
      # its default build-tools itself once the licenses are accepted (setup-android does that).
      - name: Android SDK platform
        run: sdkmanager --install "platforms;android-37.2"

      - name: Release keystore
        env:
          S1_KEYSTORE_B64: ${{ secrets.S1_KEYSTORE_B64 }}
        run: |
          [ -n "$S1_KEYSTORE_B64" ] || { echo "::error::secret S1_KEYSTORE_B64 is not set (docs/releasing.md)"; exit 1; }
          umask 077
          printf '%s' "$S1_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/glassworks-s1-release.jks"
          echo "S1_KEYSTORE_FILE=$RUNNER_TEMP/glassworks-s1-release.jks" >> "$GITHUB_ENV"

      - name: Build the release APKs, one per ABI
        env:
          S1_VERSION: ${{ env.VERSION }}
          S1_REQUIRE_RELEASE_SIGNING: 'true'
          S1_KEYSTORE_PASSWORD: ${{ secrets.S1_KEYSTORE_PASSWORD }}
          S1_KEY_ALIAS: ${{ secrets.S1_KEY_ALIAS }}
          S1_KEY_PASSWORD: ${{ secrets.S1_KEY_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/apk"
          for abi in $ABIS; do
            bundle="$S1_RADIO_BUNDLE_ASSETS"; [ "$abi" = armeabi-v7a ] || bundle=""
            S1_RADIO_BUNDLE_ASSETS="$bundle" ./gradlew --no-daemon :kiosk:assembleRelease -Ps1Abi="$abi"
            cp frames/aqara-s1-plus/android/build/outputs/apk/release/kiosk-release.apk "$RUNNER_TEMP/apk/$abi.apk"
          done

      - name: Name, verify and checksum
        run: |
          mkdir dist
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner"
          aapt2="$(dirname "$apksigner")/aapt2"
          # = Releases.kt ApkAbi.apkName (ApkAbiListsTest runs this line). The S1's name has no ABI in it:
          # panels up to 0.4.3 look only for s1-kiosk-<version>.apk.
          apk_name() { if [ "$1" = armeabi-v7a ]; then echo "s1-kiosk-$VERSION.apk"; else echo "s1-kiosk-$1-$VERSION.apk"; fi; }
          for abi in $ABIS; do
            name="$(apk_name "$abi")"
            apk="dist/$name"
            cp "$RUNNER_TEMP/apk/$abi.apk" "$apk"
            "$apksigner" verify --verbose --print-certs "$apk"
            tools/release/check-update-compat.sh --signed "$apk"   # the release key, stable identifiers
            badging="$("$aapt2" dump badging "$apk")"
            echo "${badging%%$'\n'*}"
            case "${badging%%$'\n'*}" in
              *"name='sh.edm.s1kiosk'"*"versionName='$VERSION'"*) ;;
              *) echo "::error::$name: package/version is not sh.edm.s1kiosk $VERSION"; exit 1 ;;
            esac
            native="$(sed -n "s/^native-code: //p" <<<"$badging")"
            [ "$native" = "'$abi'" ] || { echo "::error::$name has native code for $native, not '$abi'"; exit 1; }
            if [ "$abi" = armeabi-v7a ]; then
              unzip -l "$apk" | grep -q 'assets/radio-bundle/manifest.sig$' || { echo "::error::$name has no signed radio bundle"; exit 1; }
            elif unzip -l "$apk" | grep -q 'assets/radio-bundle/'; then
              echo "::error::$name must not carry the S1's radio bundle"; exit 1
            fi
            if unzip -l "$apk" | grep -q 'assets/radio-bundle/.*zigbeed$'; then echo "::error::Silicon Labs' zigbeed must never be in the APK"; exit 1; fi
            (cd dist && sha256sum "$name" > "$name.sha256" && cat "$name.sha256")
          done

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --latest: apps up to 0.4.3 only read releases/latest, so an S1 release must always be the
          # one marked latest. Releases of other frames and libraries in this repo use --latest=false.
          # A beta (#605) is a pre-release and never latest: releases/latest stays the S1 app's stable.
          # Checked again here, under the job's lock: another S1 tag may have published since the inputs job.
          tools/release/check-newer-than-released.sh aqara-s1-plus "$VERSION"
          if [ "$CHANNEL" = beta ]; then flags=(--prerelease --latest=false); title="Glassworks for the Aqara S1 Plus $VERSION beta"
          else flags=(--latest); title="Glassworks for the Aqara S1 Plus $VERSION"; fi
          gh release create "$GITHUB_REF_NAME" dist/*.apk dist/*.apk.sha256 \
            --verify-tag "${flags[@]}" --title "$title" --notes-file "$RUNNER_TEMP/notes.md"

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/glassworks-s1-release.jks"
