# Test build of Glassworks for generic Android (#23, frames/generic-android/android), on the same branches as
# S1 Kiosk's test build (test-build.yml):
#
#   git push origin HEAD:test-build/<name>
#   gh run download <run-id> -n glassworks-generic-test-<sha>
#   adb install -r glassworks-generic-test-0.1.0-arm64-v8a-<sha>.apk      (installs, or updates in place, data kept)
#   adb install -r glassworks-generic-test-0.1.1-arm64-v8a-<sha>.apk      (a higher version, to try an update)
#   glassworks-generic-legacy-test-0.1.0-arm64-v8a-<sha>.apk             (the legacy build, Android 6-7: the Mirror)
#
# What it is:
#   - The release variant, applicationId dev.glassworks.generic_android. It never installs over S1 Kiosk.
#   - The legacy build too (#198): dev.glassworks.generic_android.legacy, minSdk 23, GeckoView 144, 0.1.0 and 0.1.1
#     for arm64-v8a (the Mirror's ABI), with the same key. Its APK carries desugar_jdk_libs code (GPL-2.0 with
#     the Classpath exception), which the maintainer allowed on 2026-11-16 (AGENTS.md, rule 4).
#   - Signed with Glassworks' release key (`release-signing` environment, GENERIC_* secrets;
#     frames/generic-android/README.md, "Signing"), so a test build updates any earlier test build or release in
#     place, settings kept. Once only: a build from before 2026-11-17 was signed with a key made for its own run,
#     so uninstall it first (that wipes the app's settings).
#   - 0.1.0 for each ABI the frame runs, and 0.1.1 for arm64-v8a, so an update in place can be tried.
#   - Kept for 3 days; the repo is public. Only pushes (write access) and manual runs trigger it, so pull requests
#     from forks never get the key.
name: Generic test build

on:
  push:
    branches: ['test-build/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generic-test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release-signing   # the APK key; this environment allows only main and test-build/**
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools

      - name: Android SDK platform
        run: sdkmanager --install "platforms;android-37.2"

      - name: Release keystore
        env:
          GENERIC_KEYSTORE_B64: ${{ secrets.GENERIC_KEYSTORE_B64 }}
        run: |
          [ -n "$GENERIC_KEYSTORE_B64" ] || { echo "::error::secret GENERIC_KEYSTORE_B64 is not set (frames/generic-android/README.md)"; exit 1; }
          umask 077
          printf '%s' "$GENERIC_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/glassworks-release.jks"
          echo "GENERIC_KEYSTORE_FILE=$RUNNER_TEMP/glassworks-release.jks" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build, one APK per ABI and version
        env:
          GENERIC_REQUIRE_RELEASE_SIGNING: 'true'
          GENERIC_KEYSTORE_PASSWORD: ${{ secrets.GENERIC_KEYSTORE_PASSWORD }}
          GENERIC_KEY_ALIAS: ${{ secrets.GENERIC_KEY_ALIAS }}
          GENERIC_KEY_PASSWORD: ${{ secrets.GENERIC_KEY_PASSWORD }}
        run: |
          mkdir -p generic-dist
          frame_abis="$(jq -r '.abis[]' frames/generic-android/design/frame.json)"
          builds="$(for a in $frame_abis; do echo "0.1.0 $a"; done; echo "0.1.1 arm64-v8a")"
          while read -r version a; do
            ./gradlew --no-daemon :generic-android:assembleRelease -Ps1Abi="$a" -PgenericVersion="$version" -Ps1TestBuild="$SHORT_SHA"
            cp frames/generic-android/android/build/outputs/apk/release/generic-android-release.apk \
              "generic-dist/glassworks-generic-test-$version-$a-$SHORT_SHA.apk"
          done <<< "$builds"
          # The legacy build (#198), for the Mirror's ABI. Its GeckoView follows -PlegacyAbi, the APK -Ps1Abi.
          for version in 0.1.0 0.1.1; do
            ./gradlew --no-daemon :generic-android:assembleLegacy -Ps1Abi=arm64-v8a -PlegacyAbi=arm64-v8a \
              -PgenericVersion="$version" -Ps1TestBuild="$SHORT_SHA"
            cp frames/generic-android/android/build/outputs/apk/legacy/generic-android-legacy.apk \
              "generic-dist/glassworks-generic-legacy-test-$version-arm64-v8a-$SHORT_SHA.apk"
          done

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/glassworks-release.jks"

      - name: Verify and checksum
        env:
          # Glassworks' release certificate (CN=Glassworks, O=GlassworksHQ, 2026-11-17). Public, not a secret.
          GLASSWORKS_CERT_SHA256: 564d1367c4eafeac81e80b5b51d4db090a5df9b615d5aa46a83c4c33d5c67caa
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner"
          aapt2="$(dirname "$apksigner")/aapt2"
          echo "### Generic test build" >> "$GITHUB_STEP_SUMMARY"
          cd generic-dist
          for apk in *.apk; do
            "$apksigner" verify "$apk"
            # The certificate's SHA-256, not its name: a new key with the same name must fail here, or every
            # installed build would refuse the next update (frames/generic-android/README.md, "Signing").
            certs="$("$apksigner" verify --print-certs "$apk" 2>&1 || true)"
            # Every signer block apksigner prints ("Signer #1 …", or "Signer (minSdkVersion=…) …" per
            # SDK range), reduced to the distinct certificates: exactly one, and it must be ours.
            digests="$(sed -n 's/^Signer.* certificate SHA-256 digest: //p' <<< "$certs" | sort -u)"
            if [ "$digests" != "$GLASSWORKS_CERT_SHA256" ]; then
              echo "::error::$apk isn't signed with Glassworks' release key alone (signers: $(tr '\n' ' ' <<< "$digests"))"
              grep '^Signer' <<< "$certs" || true
              exit 1
            fi
            badging="$("$aapt2" dump badging "$apk")"
            case "$apk" in
              glassworks-generic-legacy-test-*) id=dev.glassworks.generic_android.legacy min=23
                unzip -l "$apk" | grep -q "lib/arm64-v8a/libxul.so" || { echo "::error::$apk has no arm64-v8a GeckoView"; exit 1; } ;;
              *) id=dev.glassworks.generic_android min=26 ;;
            esac
            grep -q "^package: name='$id'" <<< "$badging" || { echo "::error::$apk is not $id"; exit 1; }
            grep -q "^minSdkVersion:'$min'" <<< "$badging" || { echo "::error::$apk: minSdk is not $min"; exit 1; }
            # A privileged system app's permissions, from the first build on (the Mirror, #198).
            for perm in INSTALL_PACKAGES REBOOT WRITE_SECURE_SETTINGS; do
              grep -q "^uses-permission: name='android.permission.$perm'" <<< "$badging" || { echo "::error::$apk doesn't ask for $perm"; exit 1; }
            done
            # versionCode = major*10000 + minor*100 + patch, so 0.1.1 installs over 0.1.0 in place.
            IFS=. read -r major minor patch <<< "$(sed -E 's/^glassworks-generic-(legacy-)?test-([0-9.]+)-.*/\2/' <<< "$apk")"
            grep -q "versionCode='$((major * 10000 + minor * 100 + patch))'" <<< "$badging" || { echo "::error::$apk: unexpected versionCode"; exit 1; }
            sha256sum "$apk" | tee "$apk.sha256"
            echo "- \`$apk\` ($(stat -c %s "$apk") bytes)" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "gh run download $GITHUB_RUN_ID -R $GITHUB_REPOSITORY -n glassworks-generic-test-$SHORT_SHA" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: glassworks-generic-test-${{ env.SHORT_SHA }}
          path: generic-dist/
          retention-days: 3
          if-no-files-found: error
