# Test build of Glassworks for generic Android (#23, frames/generic-android/android), on the same branches as
# The S1 app's test build (test-build.yml):
#
#   git push origin HEAD:test-build/<name>          (or a manual run, with `version` to build as)
#   gh run download <run-id> -n glassworks-generic-test-<sha>
#   adb install -r glassworks-generic-test-<V>-arm64-v8a-<sha>.apk        (installs, or updates in place, data kept)
#   adb install -r glassworks-generic-test-<V+1>-arm64-v8a-<sha>.apk      (the next patch, to try an update)
#   glassworks-generic-legacy-test-<L>-arm64-v8a-<sha>.apk               (the legacy build, Android 6-7: the Mirror)
#
# <V> is the `version` input, else the latest generic release (generic-android-vX.Y.Z), else 0.1.0; <L> the same
# for the legacy line (generic-android-legacy-vX.Y.Z). Android refuses an APK below the installed versionCode,
# and an equal one installs in place, so a test build of the latest release's version goes onto a panel that runs
# it (a panel on 0.2.0, versionCode 200, takes a 0.2.0 test build) without an uninstall.
#
# What it is:
#   - The release variant, applicationId dev.glassworks.generic_android. It never installs over the S1 app.
#   - The legacy build too (#198): dev.glassworks.generic_android.legacy, minSdk 23, GeckoView 144, <L> and <L+1>
#     for arm64-v8a (the Mirror's ABI), with the same key. Its APK carries desugar_jdk_libs code (GPL-2.0 with
#     the Classpath exception), which the maintainer allowed on 2026-11-16 (AGENTS.md, rule 4).
#   - Signed with Glassworks' release key (`release-signing` environment, GENERIC_* secrets;
#     frames/generic-android/README.md, "Signing"), so a test build updates any earlier test build or release in
#     place, settings kept. Once only: a build from before 2026-11-17 was signed with a key made for its own run,
#     so uninstall it first (that wipes the app's settings).
#   - <V> for each ABI the frame runs, and <V+1> for arm64-v8a, so an update in place can be tried.
#   - Kept for 3 days; the repo is public. Only pushes (write access) and manual runs trigger it, so pull requests
#     from forks never get the key.
name: Generic test build

on:
  push:
    branches: ['test-build/**']
  workflow_dispatch:
    inputs:
      version:
        description: 'MAJOR.MINOR.PATCH to build as (default: the latest generic release)'
        required: false

permissions:
  contents: read

concurrency:
  group: generic-test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release-signing   # the APK key; this environment allows only main and test-build/**
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools

      - name: Android SDK platform
        run: sdkmanager --install "platforms;android-37.2"

      - name: Release keystore
        env:
          GENERIC_KEYSTORE_B64: ${{ secrets.GENERIC_KEYSTORE_B64 }}
        run: |
          [ -n "$GENERIC_KEYSTORE_B64" ] || { echo "::error::secret GENERIC_KEYSTORE_B64 is not set (frames/generic-android/README.md)"; exit 1; }
          umask 077
          printf '%s' "$GENERIC_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/glassworks-release.jks"
          echo "GENERIC_KEYSTORE_FILE=$RUNNER_TEMP/glassworks-release.jks" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Versions (input, then the latest release of each line)
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          latest() {   # the newest release of one line (tag <prefix>X.Y.Z), over every page of releases; 0.1.0 without one
            local t
            t=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '.[] | select((.draft or .prerelease) | not) | .tag_name' \
              | grep -E "^$1[0-9]+[.][0-9]+[.][0-9]+$" | head -n 1 || true)
            echo "${t#"$1"}" | sed 's/^$/0.1.0/'
          }
          next() {     # the next version, carrying a patch or minor of 99 over (versionCode = major*10000 + minor*100 + patch)
            IFS=. read -r a b c <<< "$1"
            if [ "$c" -lt 99 ]; then echo "$a.$b.$((c + 1))"; elif [ "$b" -lt 99 ]; then echo "$a.$((b + 1)).0"; else echo "$((a + 1)).0.0"; fi
          }
          valid() { [[ "$1" =~ ^(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)$ ]]; }
          v="${INPUT_VERSION:-$(latest generic-android-v)}"
          l="${INPUT_VERSION:-$(latest generic-android-legacy-v)}"
          nv=""; nl=""
          valid "$v" && nv=$(next "$v"); valid "$l" && nl=$(next "$l")
          for x in "$v" "$nv" "$l" "$nl"; do
            valid "$x" || { echo "::error::version '$x' is not MAJOR.MINOR.PATCH (major < 10000, minor/patch < 100), or has no successor"; exit 1; }
          done
          { echo "VERSION=$v"; echo "NEXT_VERSION=$nv"; echo "LEGACY_VERSION=$l"; echo "LEGACY_NEXT=$nl"; } >> "$GITHUB_ENV"
          echo "Generic $v (and $nv), legacy $l (and $nl)" >> "$GITHUB_STEP_SUMMARY"

      - name: Build, one APK per ABI and version
        env:
          GENERIC_REQUIRE_RELEASE_SIGNING: 'true'
          GENERIC_KEYSTORE_PASSWORD: ${{ secrets.GENERIC_KEYSTORE_PASSWORD }}
          GENERIC_KEY_ALIAS: glassworks   # not a secret; as a secret, GitHub would mask every "glassworks" in the log
          GENERIC_KEY_PASSWORD: ${{ secrets.GENERIC_KEY_PASSWORD }}
        run: |
          mkdir -p generic-dist
          frame_abis="$(jq -r '.abis[]' frames/generic-android/design/frame.json)"
          builds="$(for a in $frame_abis; do echo "$VERSION $a"; done; echo "$NEXT_VERSION arm64-v8a")"
          while read -r version a; do
            ./gradlew --no-daemon :generic-android:assembleRelease -Ps1Abi="$a" -PgenericVersion="$version" -Ps1TestBuild="$SHORT_SHA"
            cp frames/generic-android/android/build/outputs/apk/release/generic-android-release.apk \
              "generic-dist/glassworks-generic-test-$version-$a-$SHORT_SHA.apk"
          done <<< "$builds"
          # The legacy build (#198), for the Mirror's ABI. Its GeckoView follows -PlegacyAbi, the APK -Ps1Abi.
          for version in "$LEGACY_VERSION" "$LEGACY_NEXT"; do
            ./gradlew --no-daemon :generic-android:assembleLegacy -Ps1Abi=arm64-v8a -PlegacyAbi=arm64-v8a \
              -PgenericVersion="$version" -Ps1TestBuild="$SHORT_SHA"
            cp frames/generic-android/android/build/outputs/apk/legacy/generic-android-legacy.apk \
              "generic-dist/glassworks-generic-legacy-test-$version-arm64-v8a-$SHORT_SHA.apk"
          done

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/glassworks-release.jks"

      - name: Verify and checksum
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner"
          aapt2="$(dirname "$apksigner")/aapt2"
          echo "### Generic test build" >> "$GITHUB_STEP_SUMMARY"
          cd generic-dist
          for apk in *.apk; do
            "$apksigner" verify "$apk"
            case "$apk" in glassworks-generic-legacy-test-*) app=generic-android-legacy ;; *) app=generic-android ;; esac
            # Glassworks' release key alone, by its certificate's SHA-256 (tools/release/generic-release-cert.sha256), not
            # its name: a new key with the same name must fail here, or every installed build would refuse the next update
            # (frames/generic-android/README.md, "Signing"). Also the package and the components named from outside.
            ../tools/release/check-update-compat.sh --app "$app" --signed "$apk"
            badging="$("$aapt2" dump badging "$apk")"
            case "$apk" in
              glassworks-generic-legacy-test-*) id=dev.glassworks.generic_android.legacy min=23 settings=yes
                unzip -l "$apk" | grep -q "lib/arm64-v8a/libxul.so" || { echo "::error::$apk has no arm64-v8a GeckoView"; exit 1; } ;;
              *) id=dev.glassworks.generic_android min=26 settings=no ;;
            esac
            grep -q "^package: name='$id'" <<< "$badging" || { echo "::error::$apk is not $id"; exit 1; }
            grep -q "^minSdkVersion:'$min'" <<< "$badging" || { echo "::error::$apk: minSdk is not $min"; exit 1; }
            # A privileged system app's permissions, from the first build on (the Mirror, #198).
            for perm in INSTALL_PACKAGES REBOOT WRITE_SECURE_SETTINGS; do
              grep -q "^uses-permission: name='android.permission.$perm'" <<< "$badging" || { echo "::error::$apk doesn't ask for $perm"; exit 1; }
            done
            # WRITE_SETTINGS: the setup hotspot's setWifiApEnabled on Android 6-7, so the legacy build alone asks for it.
            asks=no; grep -q "^uses-permission: name='android.permission.WRITE_SETTINGS'" <<< "$badging" && asks=yes
            [ "$asks" = "$settings" ] || { echo "::error::$apk: asks for WRITE_SETTINGS: $asks, should: $settings"; exit 1; }
            # versionCode = major*10000 + minor*100 + patch, so 0.1.1 installs over 0.1.0 in place.
            IFS=. read -r major minor patch <<< "$(sed -E 's/^glassworks-generic-(legacy-)?test-([0-9.]+)-.*/\2/' <<< "$apk")"
            grep -q "versionCode='$((major * 10000 + minor * 100 + patch))'" <<< "$badging" || { echo "::error::$apk: unexpected versionCode"; exit 1; }
            sha256sum "$apk" | tee "$apk.sha256"
            echo "- \`$apk\` ($(stat -c %s "$apk") bytes)" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "gh run download $GITHUB_RUN_ID -R $GITHUB_REPOSITORY -n glassworks-generic-test-$SHORT_SHA" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: glassworks-generic-test-${{ env.SHORT_SHA }}
          path: generic-dist/
          retention-days: 3
          if-no-files-found: error
