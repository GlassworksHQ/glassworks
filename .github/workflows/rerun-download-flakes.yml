# Reruns the failed jobs of a red `PR checks` run once, when every failed job failed on a download (docs/ci.md, Reruns).
#
# A download that fails on one runner tends to keep failing there: on #631's runs the plugin portal and Maven Central
# both answered 404 for files they have, three times in a row, 45 s apart. A rerun on a fresh runner passed every time
# (5 of 5 on 2026-11-18 and 19). tools/ci/rerun_flakes.py reads each failed job's log and asks for
# `gh run rerun --failed` only when all of them show a download failure (its patterns and tests are in tools/ci).
#
# Like size-comment.yml it runs from the default branch after the PR's run, and never runs that run's code: it checks
# out the default branch for the script and reads only the run's jobs and logs. Only a first attempt reruns, so it
# reruns a run at most once. Not for a fork's run. It posts nothing on the PR: one line in this job's summary.
name: Rerun download flakes

on:
  workflow_run:
    workflows: ["PR checks"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  rerun:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1 &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Rerun the failed jobs if each failed on a download
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: python3 tools/ci/rerun_flakes.py --repo "$GITHUB_REPOSITORY" --run "$RUN_ID" --summary "$GITHUB_STEP_SUMMARY"
