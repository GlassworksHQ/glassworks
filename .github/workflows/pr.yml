# Checks every pull request (and every push to main) without any secrets, so it runs the same on
# forks. Nothing is signed or published here: test-build.yml makes installable builds and
# release.yml makes releases. The changes job picks which jobs a change needs (tools/ci/changes.py; the map
# is in docs/ci.md), and the nightly run runs them all.
#
#   app      every module's JVM unit tests, an unsigned release build, and
#            tools/release/check-update-compat.sh (the APK still updates panels in place). When the
#            libraries change, also the ESPHome keepalive test against the real aioesphomeapi client
#   libs-api23  the libraries' lint (NewApi at minSdk 23, #151). Their androidTest checks on an API 23 emulator
#            run in core-emulators.yml, on main and nightly only, like every emulator test (docs/ci.md)
#   api23    the legacy build's floor (#198): lint's NewApi over the core, the pane API, the panes and the
#            legacy engine at minSdk 23, and over the generic app's legacy build (tools/legacy/api23-report.py),
#            failing on a call above API 23 that tools/legacy/api23-baseline.txt doesn't list. Then the generic
#            app's own lint (lintDebug: its manifest, the system permissions it asks for on purpose)
#   libs-publish  a dry run of the Maven Central release (#153, docs/releasing.md "Libraries"): each
#            library's public API checked against its api/<name>.api dump, every published library
#            to mavenLocal, unsigned, its files checked, then fresh apps built
#            against them (minSdk 23 at compileSdk 37.2 and 23, and Kotlin 2.0.21 on the JVM)
#   wake-word  MicroWakeWordClipTest: the four real microWakeWord models (LiteRT in a hash-locked
#            Python venv) behind the Kotlin pipeline, over a synthesised clip (#184)
#   web     the npm workspaces from the repo root (job id kept, as branch protection names it):
#            Kiln, its packages, the frame recipes and packages/*: typecheck, tests, both builds, and
#            that the FEL routines' words in kiln/packages/fel/src/routines.ts are what routines.S
#            assembles to (scripts/check-routines.sh, with Ubuntu's LLVM 18). Then a dry run of the npm
#            release (docs/releasing.md "npm packages"): every published package built and packed, installed
#            into a fresh project, type-checked from there and imported in Node
#   refract  Refract, Kiln's download Worker (kiln/workers/refract, its own lockfile, not a root
#            workspace): typecheck and its tests in workerd. Its releases.json is kept in step with the
#            frames' installer.json by Kiln's own tests (web: refract-releases.test.ts)
#   scripts  frames/aqara-s1-plus/tools/install.sh's off-device tests, the perf test's rubric, report and grade
#            (tools/perf), the docs' relative links, the libraries' parity tables, and that every glassworks.dev brand image the
#            Markdown uses is live (a 404 fails; an unreachable site only warns)
#   perf-webrtc  Clarity's WebRTC camera (#202): the fake's peer and TURN relay under the hash-locked
#            venv, HA's real frontend (the pinned build, 117 MB) playing it in the runner's Chrome, and
#            the relay in the runner's Firefox (Gecko, the panel's engine). In two halves on two runners:
#            relay (the peer, the relay, Chrome and Firefox) and dialogs (HA's more-info dialogs)
#   root     the root side (radio helper, bundle checks, s1kiosk_verify) in a 32-bit ARM container, on an
#            Arm runner (under QEMU only when its CPU can't run 32-bit ARM)
#   size     builds the release APKs (one per frame ABI) of this branch and of its base, splits them into the
#            engine, the core, each pane and the shared libraries (tools/size/apksize.py), shows the
#            change and fails over the frame's size budget (frames/<id>/budgets.json). The report is
#            the job summary, and size-comment.yml posts it on the PR (docs/size.md)
#   size-generic  the same check for Glassworks for generic Android (#23, frames/generic-android): its
#            release APK for each ABI of its frame.json, of this branch and of its base, against
#            frames/generic-android/budgets.json. The report is the job summary, and size-comment.yml
#            adds it to the PR's size comment. Then its legacy build (#198, arm64-v8a) builds, with its
#            id, minSdk, the system permissions and its icons on API 23 (tools/legacy/apk-icons.py)
#            checked; no budget yet. Every APK also goes through tools/release/check-update-compat.sh --app (it still updates
#            installed copies in place)
#   branding rebuilds the S1's and the Mirror's boot animation and splash (branding/boot/generate.py) in a
#            pinned Python image, one frame per runner, and fails if the committed files differ
#   site     glassworks.dev (site/): lint, typecheck, the static build, and the SEO check on the built
#            site (every page in the sitemap with a title, description, canonical and preview image).
#            The build also checks the frames' data, banners and Clarity grades
name: PR checks

on:
  pull_request:
  push:
    branches: [main]
  # Every job once a night, whatever changed: the net under the changes job's map.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Gradle waits and asks again when a repository answers 429 (too many requests) or 5xx: 7 tries, 2 s apart and then
# twice as long each time (2 minutes in all), where its default gives up after 3 tries in 3 s and then stops asking that
# repository for the rest of the build. A Gradle home restored without its dependency metadata (the failure step's
# doing, below) asks Maven Central about every file it has, about 1,200 requests for libs-api23's lint, and Central
# answers part of such a burst with 429 (docs/ci.md, Caches). The -D options reach the build's own JVM, with or
# without a daemon.
env:
  GRADLE_OPTS: -Dorg.gradle.internal.repository.max.tentatives=7 -Dorg.gradle.internal.repository.initial.backoff=2000

# A new push to a PR cancels the PR's older run. Every other run has a group of its own, so a push to main
# is never cancelled, nor held behind the next one. So does a rerun (attempt 2 on, by hand or by
# rerun-download-flakes.yml): rerunning an older commit's jobs must not cancel the newer commit's run.
concurrency:
  group: pr-${{ github.event.pull_request.number || github.run_id }}${{ github.run_attempt != '1' && format('-rerun-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  # Which jobs this change needs (tools/ci/changes.py, docs/ci.md). Every other job needs it and skips at job
  # level, so a skipped job takes no runner, and a skipped required check reports success. It fails closed:
  # unless this job succeeds, every job runs, whatever outputs it wrote before it failed.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      app: ${{ steps.pick.outputs.app }}
      app_apk: ${{ steps.pick.outputs.app_apk }}
      esphome: ${{ steps.pick.outputs.esphome }}
      libs_api23: ${{ steps.pick.outputs.libs_api23 }}
      api23: ${{ steps.pick.outputs.api23 }}
      libs_publish: ${{ steps.pick.outputs.libs_publish }}
      wake_word: ${{ steps.pick.outputs.wake_word }}
      web: ${{ steps.pick.outputs.web }}
      refract: ${{ steps.pick.outputs.refract }}
      perf: ${{ steps.pick.outputs.perf }}
      perf_webrtc: ${{ steps.pick.outputs.perf_webrtc }}
      root: ${{ steps.pick.outputs.root }}
      size: ${{ steps.pick.outputs.size }}
      size_generic: ${{ steps.pick.outputs.size_generic }}
      branding: ${{ steps.pick.outputs.branding }}
      site: ${{ steps.pick.outputs.site }}
    steps:
      # A pull request checks out its merge commit: its first parent is the base it merges into.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Pick the jobs
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) set -- --base HEAD^1 ;;
            push) if git fetch -q --depth=1 origin "$BEFORE" 2>/dev/null; then set -- --base "$BEFORE"; else set -- --all; fi ;;
            *) set -- --all ;;
          esac
          python3 tools/ci/changes.py "$@" --summary "$GITHUB_STEP_SUMMARY" >> "$GITHUB_OUTPUT"

      # The size job's artifact, for the PR its numbers would have gone to: size-comment.yml replaces an earlier
      # size comment with a note, since this PR no longer changes anything that goes into the APKs.
      - name: No size check for this PR
        if: github.event_name == 'pull_request' && steps.pick.outputs.size == 'false'
        env:
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/size"
          printf '{"pr": %d, "head_sha": "%s", "skipped": true}\n' "$PR" "$HEAD_SHA" > "$RUNNER_TEMP/size/pr.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'pull_request' && steps.pick.outputs.size == 'false'
        with:
          name: apk-size
          path: ${{ runner.temp }}/size/pr.json
          retention-days: 7

  app:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.app != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # Same toolchain as release.yml. setup-gradle restores Gradle's caches, the build cache among them, from
      # what runs on main saved (a PR only reads them), so a PR rebuilds and retests only what it changed: every
      # test declares the repo files it reads (build-logic, readsRepoFiles).
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools

      - name: Android SDK platform
        run: sdkmanager --install "platforms;android-37.2"

      # ContentScriptReadyTest runs the web extension's content.js under node; on CI it fails without it.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      # Robolectric fetches its Android jars (android-all-instrumented, one per SDK a test runs on) from Maven Central
      # while the tests run, outside Gradle's caches. A failed fetch fails the whole test class: 6 of the 13 red app
      # runs on 2026-11-18 and 19. Named by Robolectric's version; runs that aren't for a PR save what they fetched.
      - name: Robolectric's version
        id: robolectric
        run: |
          v=$(git grep -h -oE 'org\.robolectric:robolectric:[0-9][0-9A-Za-z.-]*' -- '*.gradle.kts' | cut -d: -f3 | sort -u | paste -sd+ -)
          echo "version=${v:-none}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: robolectric-jars
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ steps.robolectric.outputs.version }}-${{ github.run_id }}
          restore-keys: robolectric-${{ steps.robolectric.outputs.version }}-

      # The island end to end (IslandEndToEndTest): community cards drawn in island pages by headless Chromium, from
      # Vitro's own store and bridge. Playwright's headless shell (by the parity tools' pinned playwright-core) and the
      # parity harness's pinned cards (checked by SHA-256), both cached.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: vitro-islands
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/glassworks-perf/cards
          key: vitro-islands-${{ hashFiles('tools/vitro-parity/package-lock.json', 'tools/vitro-parity/cards.json') }}
      # The headless shell's one library the runner image lacks (Playwright's --with-deps also pulled fonts and Mesa
      # through a fresh apt-get, about 97 s a run; the cards draw Latin text in the runner's own fonts).
      - name: libgbm1
        uses: ./.github/actions/apt-install
        with:
          packages: libgbm1
      - name: The island end to end's browser and cards
        run: |
          npm ci --prefix tools/vitro-parity
          node tools/vitro-parity/node_modules/playwright-core/cli.js install --only-shell chromium
          python3 tools/vitro-parity/cards.py fetch

      # --parallel: the modules' test tasks side by side on the runner's 4 cores (no test shares a port or a file).
      - name: Unit tests
        env:
          GW_VITRO_ISLAND_E2E: '1'
        run: ./gradlew --no-daemon --parallel test

      # When the Vitro parity harness fails, its report says which card drifted and how (HA, Vitro and the diff side
      # by side), and the test's XML lists every failing case: the log only shows the assertion's line.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: vitro-parity-report
          path: |
            engines/engine-vitro/build/reports/vitro-parity/
            engines/engine-vitro/build/test-results/testDebugUnitTest/TEST-dev.glassworks.engine.vitro.parity.*.xml
          retention-days: 7
          if-no-files-found: ignore

      # Saved only when the tests fetched a jar the restored copy didn't have, and never by a PR.
      - name: Robolectric's jars, what changed
        id: robolectric-new
        env:
          RESTORED: ${{ steps.robolectric-jars.outputs.cache-matched-key }}
          VERSION: ${{ steps.robolectric.outputs.version }}
        run: |
          dir=~/.m2/repository/org/robolectric
          [ -d "$dir" ] || { echo "No $dir: the tests fetched nothing there."; exit 0; }
          du -sh "$dir"
          key="robolectric-$VERSION-$(cd "$dir" && find . -name '*.jar' | sort | sha256sum | cut -c1-16)"
          if [ "$key" = "$RESTORED" ]; then echo "The same jars as $RESTORED."; else echo "New: $key (restored: ${RESTORED:-none})."; echo "key=$key" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: steps.robolectric-new.outputs.key != '' && github.event_name != 'pull_request'
        with:
          path: ~/.m2/repository/org/robolectric
          key: ${{ steps.robolectric-new.outputs.key }}
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: steps.vitro-islands.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/glassworks-perf/cards
          key: vitro-islands-${{ hashFiles('tools/vitro-parity/package-lock.json', 'tools/vitro-parity/cards.json') }}

      - name: Release build (unsigned)
        if: needs.changes.result != 'success' || needs.changes.outputs.app_apk != 'false'
        run: ./gradlew --no-daemon :kiosk:assembleRelease

      - name: Still updates panels in place
        if: needs.changes.result != 'success' || needs.changes.outputs.app_apk != 'false'
        run: |
          tools/release/check-update-compat.sh frames/aqara-s1-plus/android/build/outputs/apk/release/kiosk-release-unsigned.apk

      # EspHomeKeepaliveTest (#180), EspHomeActionsCameraTest (#120), EspHomeHaEventTest (#118), EspHomeCapsTimeTest (#337),
      # EspHomeBluetoothConnectionsTest (#246) and BluetoothProxyHomeAssistantTest (#121) against the real aioesphomeapi
      # client. They skip without ESPHOME_PYTHON, so this step fails if one skipped. About 30 s (venv
      # from hashed wheels, then those tests only), and only when the libraries changed. The kiosk's EspHomeApiTest uses the same
      # client but isn't here yet. It failed once in two CI runs (#184).
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: needs.changes.result != 'success' || needs.changes.outputs.esphome != 'false'
        with:
          python-version: '3.12'

      - name: Keepalive, actions, camera, event and Bluetooth proxy tests (real aioesphomeapi client)
        if: needs.changes.result != 'success' || needs.changes.outputs.esphome != 'false'
        run: |
          esphome_api=libs/esphome-api
          bluetooth_proxy=libs/bluetooth-proxy
          python -m venv "$RUNNER_TEMP/esphome-venv"
          "$RUNNER_TEMP/esphome-venv/bin/pip" install --quiet --require-hashes --only-binary :all: \
            -r "$esphome_api/test-requirements.txt"
          results=$esphome_api/build/test-results/test
          reports="$results/TEST-dev.glassworks.esphome.EspHomeKeepaliveTest.xml $results/TEST-dev.glassworks.esphome.EspHomeActionsCameraTest.xml
            $results/TEST-dev.glassworks.esphome.EspHomeHaEventTest.xml $results/TEST-dev.glassworks.esphome.EspHomeCapsTimeTest.xml
            $results/TEST-dev.glassworks.esphome.EspHomeBluetoothConnectionsTest.xml
            $bluetooth_proxy/build/test-results/testDebugUnitTest/TEST-dev.glassworks.esphome.bluetoothproxy.BluetoothProxyHomeAssistantTest.xml"
          # --rerun: Gradle doesn't see ESPHOME_PYTHON, and the Unit tests step left the task up to date.
          # On a failure, the report's message holds the Python client's output.
          ESPHOME_PYTHON="$RUNNER_TEMP/esphome-venv/bin/python" ./gradlew --no-daemon --continue \
            :esphome-api:test --tests dev.glassworks.esphome.EspHomeKeepaliveTest \
            --tests dev.glassworks.esphome.EspHomeActionsCameraTest --tests dev.glassworks.esphome.EspHomeHaEventTest \
            --tests dev.glassworks.esphome.EspHomeCapsTimeTest --tests dev.glassworks.esphome.EspHomeBluetoothConnectionsTest --rerun \
            :bluetooth-proxy:testDebugUnitTest --tests dev.glassworks.esphome.bluetoothproxy.BluetoothProxyHomeAssistantTest --rerun \
            || { cat $reports; exit 1; }
          for report in $reports; do
            grep -q '<testsuite [^>]* skipped="0"' "$report" || { echo "::error::$report: a test skipped"; exit 1; }
          done

      # So a failed run can't save a remembered "missing" artifact into the cache (docs/ci.md, Caches).
      - name: Forget Gradle's dependency metadata after a failure
        if: failure()
        run: rm -rf ~/.gradle/caches/modules-2/metadata-*


  libs-api23:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.libs_api23 != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools
      - name: Android SDK platform
        run: sdkmanager --install "platforms;android-37.2"
      - name: Lint (NewApi at minSdk 23)
        run: ./gradlew --no-daemon :esphome-api-android:lintDebug :improv:lintDebug :bluetooth-proxy:lintDebug :sendspin:lintDebug :voice:lintDebug :ha-webrtc:lintDebug

      # So a failed run can't save a remembered "missing" artifact into the cache (docs/ci.md, Caches).
      - name: Forget Gradle's dependency metadata after a failure
        if: failure()
        run: rm -rf ~/.gradle/caches/modules-2/metadata-*

  # The legacy build's floor (#198): no new call above API 23 in the Glassworks modules. The report lowers minSdk to
  # 23 for this run only (tools/legacy/api23-lint.gradle) and fails on a call tools/legacy/api23-baseline.txt doesn't
  # list. The libraries are minSdk 23 already (libs-api23); this covers the core, the pane API, the panes and the
  # legacy engine. docs/research/legacy-engine.md has the table.
  api23:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.api23 != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools
      - name: Android SDK platform
        run: sdkmanager --install "platforms;android-37.2"
      - name: No new call above API 23
        run: |
          python3 tools/legacy/api23-report.py --check tools/legacy/api23-baseline.txt
          {
            echo "### Calls above API 23 (the legacy build's floor, #198)"
            python3 tools/legacy/api23-report.py --no-gradle | sed -n '1,/^$/p'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: The generic app's lint
        # Without the report's init script: every check, at its own minSdk. Its manifest asks for
        # INSTALL_PACKAGES, REBOOT and WRITE_SECURE_SETTINGS on purpose (tools:ignore="ProtectedPermissions").
        run: ./gradlew --no-daemon :generic-android:lintDebug

      # So a failed run can't save a remembered "missing" artifact into the cache (docs/ci.md, Caches).
      - name: Forget Gradle's dependency metadata after a failure
        if: failure()
        run: rm -rf ~/.gradle/caches/modules-2/metadata-*


  libs-publish:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.libs_publish != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools
      # 23: lib-consumer-check.sh builds an app at compileSdk 23, the AARs' minCompileSdk.
      - name: Android SDK platforms
        run: sdkmanager --install "platforms;android-37.2" "platforms;android-23"

      # Fails when a library's public API changed and libs/<name>/api/<name>.api didn't: run
      # ./gradlew apiDump and commit the dump (docs/releasing.md "The public API").
      - name: The public API matches its dump
        run: ./gradlew --no-daemon apiCheck

      # No secrets here, so nothing is signed (the root build.gradle.kts signs only with a key).
      - name: Publish to mavenLocal
        run: ./gradlew --no-daemon publishToMavenLocal

      - name: Check each library's files
        run: |
          for build in $(grep -l 'id("com.vanniktech.maven.publish")' libs/*/build.gradle.kts); do
            tools/release/check-lib-artifact.sh "$(basename "$(dirname "$build")")"
          done

      - name: A fresh minSdk 23 app builds against them
        run: tools/release/lib-consumer-check.sh

  # MicroWakeWordClipTest (#181, #184): each official microWakeWord model, run by LiteRT over a pipe to
  # Python, must fire in its own word only and score within 0.01 of pymicro-wakeword. It skips without
  # MWW_PYTHON, so this job fails if it skipped. The models come from raw.githubusercontent.com at
  # the commit WakeWords.kt pins, checked against its SHA-256s, and are cached by that commit.

      # So a failed run can't save a remembered "missing" artifact into the cache (docs/ci.md, Caches).
      - name: Forget Gradle's dependency metadata after a failure
        if: failure()
        run: rm -rf ~/.gradle/caches/modules-2/metadata-*

  wake-word:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.wake_word != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # Same toolchain as the app job.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools

      - name: Android SDK platform
        run: sdkmanager --install "platforms;android-37.2"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: LiteRT venv (hashed wheels)
        run: |
          requirements=libs/voice/mww-test-requirements.txt
          python -m venv "$RUNNER_TEMP/mww-venv"
          "$RUNNER_TEMP/mww-venv/bin/pip" install --quiet --require-hashes --only-binary :all: \
            -r "$requirements"

      - name: Models commit
        id: models
        run: |
          wake_words=libs/voice/src/main/java/dev/glassworks/voice/WakeWords.kt
          commit=$(sed -n 's/.*const val MODELS_COMMIT\(: String\)\{0,1\} = "\([0-9a-f]\{40\}\)".*/\2/p' "$wake_words")
          [ -n "$commit" ] || { echo "::error::no MODELS_COMMIT in WakeWords.kt"; exit 1; }
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      # The test checks every file's SHA-256 (ModelFetcher) and fetches again on a mismatch.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/glassworks/microwakeword-${{ steps.models.outputs.commit }}
          key: microwakeword-${{ steps.models.outputs.commit }}

      - name: MicroWakeWordClipTest (real models)
        run: |
          # --rerun: Gradle doesn't see MWW_PYTHON, so a cached result must not stand in for a run.
          failed=""
          MWW_PYTHON="$RUNNER_TEMP/mww-venv/bin/python" ./gradlew --no-daemon \
            :voice:testDebugUnitTest --tests dev.glassworks.voice.MicroWakeWordClipTest --rerun \
            || failed=1
          report=libs/voice/build/test-results/testDebugUnitTest/TEST-dev.glassworks.voice.MicroWakeWordClipTest.xml
          [ -z "$failed" ] || { cat "$report"; exit 1; }
          grep -q '<testsuite [^>]* skipped="0"' "$report" || { echo "::error::$report: the test skipped"; exit 1; }

      # So a failed run can't save a remembered "missing" artifact into the cache (docs/ci.md, Caches).
      - name: Forget Gradle's dependency metadata after a failure
        if: failure()
        run: rm -rf ~/.gradle/caches/modules-2/metadata-*


  web:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.web != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: e2fsprogs, which checks the ext4 images @glassworks/ext4 writes
        run: |
          command -v e2fsck debugfs mke2fs || { sudo apt-get -qq update && sudo apt-get -qq install -y --no-install-recommends e2fsprogs > /dev/null; }
          e2fsck -V
      - run: npm run typecheck
      - run: npm test
        env:
          GW_EXT4_TOOLS: require
      - name: The FEL routines match their assembly source
        run: |
          llvm=/usr/lib/llvm-18/bin
          [ -x "$llvm/clang" ] && [ -x "$llvm/llvm-objdump" ] || { sudo apt-get -qq update && sudo apt-get -qq install -y --no-install-recommends clang-18 llvm-18 > /dev/null; }
          "$llvm/clang" --version | head -1
          LLVM=$llvm kiln/packages/fel/scripts/check-routines.sh
      - name: The npm packages, as a consumer gets them (npm-release.yml's dry run)
        run: node tools/release/npm-consumer-check.mjs
      - name: The page s1.edm.sh serves builds
        run: npm run build -w kiln
      - name: Kiln (Next.js) builds
        run: npm run build -w @glassworks/kiln-app
      - name: The panel's setup page in core's assets matches its sources (#34)
        run: |
          npm run build:lan -w @glassworks/kiln-app
          if [ -n "$(git status --porcelain -- core/src/main/assets/setup)" ]; then
            git status --short -- core/src/main/assets/setup
            echo "::error::core/src/main/assets/setup differs from its sources. Rebuild it: npm run build:lan -w @glassworks/kiln-app"
            exit 1
          fi

  refract:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.refract != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: kiln/workers/refract/package-lock.json
      - run: npm ci --prefix kiln/workers/refract
      - name: Typecheck
        run: npm run typecheck --prefix kiln/workers/refract
      - name: Tests (workerd, through Miniflare)
        run: npm test --prefix kiln/workers/refract

  scripts:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: frames/aqara-s1-plus/tools/install.sh off-device tests
        run: frames/aqara-s1-plus/tools/install/test/install-tests.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.changes.result != 'success' || needs.changes.outputs.perf != 'false'
        with:
          node-version: '24'
      # Clarity's camera streams are made with ffmpeg; a test checks it makes the same bytes twice. From the cache
      # of Ubuntu's packages (docs/ci.md, Caches): a plain apt-get took up to 26 minutes.
      - name: ffmpeg
        if: needs.changes.result != 'success' || needs.changes.outputs.perf != 'false'
        uses: ./.github/actions/apt-install
        with:
          packages: ffmpeg
      # Clarity's tests in two sets (#268, tools/perf/test/parallel.py): the fast one first (seconds),
      # then the runner end to end against the fake panel, and the fakes, several at once.
      - name: Perf test rubric, report, grade and page statistics (fast set)
        if: needs.changes.result != 'success' || needs.changes.outputs.perf != 'false'
        run: |
          python3 tools/perf/test/parallel.py --set fast
          node --test tools/perf/test/page.test.mjs tools/perf/test/grade.test.mjs tools/perf/test/browserguard.test.mjs
      - name: The Manage page's All panels script (#466)
        run: node --test core/src/test/js/*.test.mjs
      - name: Perf test runner and fakes, end to end (slow set)
        if: needs.changes.result != 'success' || needs.changes.outputs.perf != 'false'
        run: python3 tools/perf/test/parallel.py --set slow
      # Its device side runs in core-emulators.yml (vitro-camera): here its fake HA's home and its checks, off-device.
      - name: Vitro camera end-to-end test's home and checks
        if: needs.changes.result != 'success' || needs.changes.outputs.perf != 'false'
        run: python3 -m unittest discover -s tools/vitro-camera-e2e/test -v
      - name: APK size tool
        run: python3 -m unittest discover -s tools/size/test -v
      - name: Release scripts and the publish steps' beta path (#605)
        run: python3 -m unittest discover -s tools/release/test -v
      - name: API 23 report tool
        run: python3 -m unittest discover -s tools/legacy/test -v
      - name: Boot generator targets and layout
        run: python3 -m unittest discover -s branding/boot/test -v
      - name: The S1's stock fastboot tools (fastboot-usb.py, wrap-ram-boot.py)
        run: python3 -m unittest discover -s frames/aqara-s1-plus/tools/fel/test -v
      # The parity harness's capture tools and its fake HA's home (#793): the corpus's fixtures resolve, and each
      # committed reference still holds what its fixture serves (tools/vitro-parity/test/test_fakehome.py).
      - name: Vitro parity capture tools and fixtures
        run: |
          python3 -m venv "$RUNNER_TEMP/vitro-parity-venv"
          "$RUNNER_TEMP/vitro-parity-venv/bin/pip" install --quiet --require-hashes -r tools/vitro-parity/requirements.txt
          "$RUNNER_TEMP/vitro-parity-venv/bin/python" -m unittest discover -s tools/vitro-parity/test -v
          node --test tools/vitro-parity/test/*.test.mjs
      - name: Docs links
        run: python3 tools/check-doc-links.py
      - name: Status labels agree with frame.json and pane.json
        run: python3 tools/check-status.py && python3 -m unittest discover -s tools/test -v
      # Here, in a required check: a map that pr.yml or docs/ci.md no longer follows fails the PR.
      - name: CI job selection (tools/ci/changes.py)
        run: python3 -m unittest discover -s tools/ci/test -v
      - name: Library parity tables
        run: python3 tools/check-parity-tables.py
      - name: Brand images are live on glassworks.dev
        run: python3 tools/check-brand-images.py
      - name: Pinned device-bins artifacts match the Refract allowlist
        run: python3 tools/check-device-bins.py

  perf-webrtc:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.perf_webrtc != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Two halves of about five minutes each, on two runners (#536): one after the other they took ten.
    # tools/ci/test/test_changes.py checks that every one of these test files is in a half.
    strategy:
      fail-fast: false
      matrix:
        part: [relay, dialogs]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: ffmpeg
        uses: ./.github/actions/apt-install
        with:
          packages: ffmpeg
      # GW_PERF_E2E=1: these fail here instead of skipping. One browser at a time (free ports).
      - name: Perf test WebRTC camera, end to end (${{ matrix.part }})
        env:
          GW_PERF_E2E: "1"
          PART: ${{ matrix.part }}
        run: |
          PY=$(python3 tools/perf/webrtcenv.py)
          case "$PART" in
            relay)
              "$PY" -m unittest discover -s tools/perf/test -p test_webrtc.py -v
              GW_PERF_FAKE_PYTHON="$PY" node --test tools/perf/test/webrtc.e2e.test.mjs
              # Gecko (the panel's engine) is stricter about TURN than Chrome: the runner's Firefox.
              GW_PERF_FAKE_PYTHON="$PY" node --test tools/perf/test/webrtc.gecko.test.mjs
              ;;
            dialogs)
              # Clarity v3 (#211): HA's more-info dialogs in HA's real frontend, at the S1's viewport.
              GW_PERF_FAKE_PYTHON="$PY" node --test tools/perf/test/dialog.e2e.test.mjs
              ;;
            *) echo "::error::no such part: $PART"; exit 1 ;;
          esac

  root:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.root != 'false') }}
    # An Arm runner: the 32-bit ARM containers run on its CPU when it can, not under QEMU on x86 (about 20 minutes, #536).
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # The image build-verify.sh builds in. armv8l: the CPU runs it (AArch32); armv7l: QEMU does.
      - name: Does this CPU run 32-bit ARM?
        id: arm32
        run: |
          image=arm32v7/alpine:3.20@sha256:9c6dfd553de893ca76841b515e379350d234939c92d47f817069cb56221c3feb
          if machine=$(docker run --rm --platform linux/arm/v7 "$image" uname -m); then
            echo "Runs 32-bit ARM containers as $machine."; echo native=true >> "$GITHUB_OUTPUT"
          else
            echo "Can't run 32-bit ARM by itself; QEMU next."; echo native=false >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: steps.arm32.outputs.native != 'true'
        with:
          platforms: arm

      - name: Build and self-test s1kiosk_verify
        run: frames/aqara-s1-plus/tools/root/build-verify.sh

      - name: Root-side tests
        run: frames/aqara-s1-plus/tools/radio/test/run.sh

  size:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.size != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90   # two ABIs on two commits, plus the radio bundle's sisdk build on a cache miss
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      # Same toolchain as the app job and release.yml.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools

      - name: Android SDK platform
        run: sdkmanager --install "platforms;android-37.2"

      # The release's armeabi-v7a APK carries the signed radio bundle (release.yml), so this one does
      # too: the same files, signed with a throwaway key (tools/size/radio-bundle.sh, docs/size.md).
      # The sisdk runtime is reproducible and checked against frames/aqara-s1-plus/tools/radio/sisdk-runtime.sha256 either
      # way; the cache only saves rebuilding it.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/sisdk-cache
          key: sisdk-${{ hashFiles('frames/aqara-s1-plus/tools/radio/build-sisdk-runtime.sh', 'frames/aqara-s1-plus/tools/radio/sisdk-runtime.sha256', 'frames/aqara-s1-plus/tools/radio/sisdk/**') }}

      - name: Radio bundle, as the release builds it
        run: SISDK_DIR="$HOME/sisdk-cache" tools/size/radio-bundle.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/bundle-head"

      # The S1's setup hotspot name (#197): the overlay in that bundle names the hotspot Glassworks, statically.
      - name: Hotspot name overlay in the bundle
        run: |
          apk="$RUNNER_TEMP/bundle-head/radio-bundle/hotspot-name.apk"
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/aapt2"
          "$aapt2" dump resources "$apk" | grep -A1 'string/wifi_localhotspot_configure_ssid_default' | grep -q '"Glassworks"'
          "$aapt2" dump badging "$apk" | grep -q "overlay: targetPackage='android' priority='1' isStatic='true'"

      - name: ABIs, one APK each as the release builds them (every frame's abis, tools/release/frame-abis.sh)
        run: |
          abis="$(tools/release/frame-abis.sh)"
          echo "ABIS=$abis" >> "$GITHUB_ENV"

      - name: Release APKs of this branch
        run: |
          mkdir -p "$RUNNER_TEMP/apk" "$RUNNER_TEMP/size"
          for abi in $ABIS; do
            bundle="$RUNNER_TEMP/bundle-head"; [ "$abi" = armeabi-v7a ] || bundle=""   # as release.yml
            S1_RADIO_BUNDLE_ASSETS="$bundle" ./gradlew --no-daemon :kiosk:assembleRelease -Ps1Abi="$abi"
            cp frames/aqara-s1-plus/android/build/outputs/apk/release/kiosk-release-unsigned.apk "$RUNNER_TEMP/apk/head-$abi.apk"
          done

      # The base: the PR's base commit, or the commit before a push. Without one, or for an ABI it
      # doesn't build, the report says so (base_missing) and the budget is still checked.
      - name: Release APKs of the base
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          missing="$RUNNER_TEMP/size/base-missing"; : > "$missing"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No base commit ($BASE); no change column."
            for abi in $ABIS; do echo "$abi=no-base-commit"; done > "$missing"
            exit 0
          fi
          git worktree add -q "$RUNNER_TEMP/base" "$BASE"
          # The base's own bundle when its inputs differ (this script, on the base's files).
          bundle="$RUNNER_TEMP/bundle-head"
          if ! git diff --quiet "$BASE" HEAD -- frames/aqara-s1-plus/tools/radio kiln/assets.lock.json; then
            bundle="$RUNNER_TEMP/bundle-base"
            SISDK_DIR="$RUNNER_TEMP/sisdk-base" tools/size/radio-bundle.sh "$RUNNER_TEMP/base" "$bundle" || bundle=""
          fi
          cd "$RUNNER_TEMP/base"
          for abi in $ABIS; do
            b="$bundle"; [ "$abi" = armeabi-v7a ] || b=""
            if [ "$abi" = armeabi-v7a ] && [ -z "$bundle" ]; then
              echo "The base's radio bundle didn't build; no change column for $abi."
              echo "$abi=base-build-failed" >> "$missing"; continue
            fi
            if S1_RADIO_BUNDLE_ASSETS="$b" ./gradlew --no-daemon :kiosk:assembleRelease -Ps1Abi="$abi"; then
              cp frames/aqara-s1-plus/android/build/outputs/apk/release/kiosk-release-unsigned.apk "$RUNNER_TEMP/apk/base-$abi.apk"
            else
              echo "The base didn't build for $abi; no change column for it."
              echo "$abi=base-build-failed" >> "$missing"
            fi
          done

      - name: Size, change and budget
        run: |
          args=""
          for abi in $ABIS; do
            args="$args --apk $abi=$RUNNER_TEMP/apk/head-$abi.apk"
            [ -f "$RUNNER_TEMP/apk/base-$abi.apk" ] && args="$args --base-apk $abi=$RUNNER_TEMP/apk/base-$abi.apk"
          done
          while IFS= read -r m; do [ -n "$m" ] && args="$args --base-missing $m"; done < "$RUNNER_TEMP/size/base-missing"
          base_budgets="$RUNNER_TEMP/base/frames/aqara-s1-plus/budgets.json"
          [ -f "$base_budgets" ] && args="$args --base-budgets $base_budgets"
          # shellcheck disable=SC2086 # $args is a list of options
          python3 tools/size/apksize.py report --frame aqara-s1-plus $args \
            --json "$RUNNER_TEMP/size/size.json" --md "$RUNNER_TEMP/size/size.md"

      - name: Job summary
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/size/size.md" ] && cat "$RUNNER_TEMP/size/size.md" >> "$GITHUB_STEP_SUMMARY" || true

      # For size-comment.yml: the numbers and which PR they are for. It renders the comment itself.
      - name: Which PR
        if: always() && github.event_name == 'pull_request'
        env:
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/size"
          printf '{"pr": %d, "head_sha": "%s"}\n' "$PR" "$HEAD_SHA" > "$RUNNER_TEMP/size/pr.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && github.event_name == 'pull_request'
        with:
          name: apk-size
          path: |
            ${{ runner.temp }}/size/size.json
            ${{ runner.temp }}/size/pr.json
          retention-days: 7
          if-no-files-found: ignore

      # So a failed run can't save a remembered "missing" artifact into the cache (docs/ci.md, Caches).
      - name: Forget Gradle's dependency metadata after a failure
        if: failure()
        run: rm -rf ~/.gradle/caches/modules-2/metadata-*


  size-generic:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.size_generic != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools

      - name: Android SDK platform
        run: sdkmanager --install "platforms;android-37.2"

      - name: Release APKs, one per ABI of the frame
        run: |
          mkdir -p "$RUNNER_TEMP/generic"
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/aapt2"
          for a in $(jq -r '.abis[]' frames/generic-android/design/frame.json); do
            ./gradlew --no-daemon :generic-android:assembleRelease -Ps1Abi="$a"
            cp frames/generic-android/android/build/outputs/apk/release/generic-android-release-unsigned.apk "$RUNNER_TEMP/generic/$a.apk"
            tools/release/check-update-compat.sh --app generic-android "$RUNNER_TEMP/generic/$a.apk"
            # Only the legacy build's hotspot needs it (setWifiApEnabled); on Android 8+ it would be a user grant for nothing.
            badging="$("$aapt2" dump badging "$RUNNER_TEMP/generic/$a.apk")"
            if grep -q "^uses-permission: name='android.permission.WRITE_SETTINGS'" <<< "$badging"; then
              echo "::error::the Android 8+ APK ($a) asks for WRITE_SETTINGS"; exit 1
            fi
          done

      # The base, as the size job builds it: for the change column. An ABI the base doesn't build has none.
      - name: Release APKs of the base
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          mkdir -p "$RUNNER_TEMP/generic-base"; missing="$RUNNER_TEMP/generic-base/missing"; : > "$missing"
          abis="$(jq -r '.abis[]' frames/generic-android/design/frame.json)"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            for a in $abis; do echo "$a=no-base-commit"; done > "$missing"; exit 0
          fi
          git worktree add -q "$RUNNER_TEMP/generic-base/src" "$BASE"
          cd "$RUNNER_TEMP/generic-base/src"
          for a in $abis; do
            if ./gradlew --no-daemon :generic-android:assembleRelease -Ps1Abi="$a"; then
              cp frames/generic-android/android/build/outputs/apk/release/generic-android-release-unsigned.apk "$RUNNER_TEMP/generic-base/$a.apk"
            else
              echo "The base didn't build for $a; no change column for it."; echo "$a=base-build-failed" >> "$missing"
            fi
          done

      - name: The legacy build (#198)
        # The Mirror's ABI. Its GeckoView follows -PlegacyAbi, the APK -Ps1Abi: the build checks they match.
        run: |
          ./gradlew --no-daemon :generic-android:assembleLegacy -Ps1Abi=arm64-v8a -PlegacyAbi=arm64-v8a
          apk=frames/generic-android/android/build/outputs/apk/legacy/generic-android-legacy-unsigned.apk
          tools/release/check-update-compat.sh --app generic-android-legacy "$apk"
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/aapt2"
          badging="$("$aapt2" dump badging "$apk")"
          grep -q "^package: name='dev.glassworks.generic_android.legacy'" <<< "$badging" || { echo "::error::the legacy APK isn't dev.glassworks.generic_android.legacy"; exit 1; }
          grep -q "^minSdkVersion:'23'" <<< "$badging" || { echo "::error::the legacy APK's minSdk isn't 23"; exit 1; }
          # WRITE_SETTINGS: the setup hotspot's setWifiApEnabled on Android 6-7.
          for perm in INSTALL_PACKAGES REBOOT WRITE_SECURE_SETTINGS WRITE_SETTINGS; do
            grep -q "^uses-permission: name='android.permission.$perm'" <<< "$badging" || { echo "::error::the legacy APK doesn't ask for $perm"; exit 1; }
          done
          unzip -l "$apk" | grep -q "lib/arm64-v8a/libxul.so" || { echo "::error::the legacy APK has no arm64-v8a GeckoView"; exit 1; }
          # No crash helper process: the Mirror's lowmemorykiller killed and restarted it every minute (engine-gecko-legacy's manifest).
          manifest="$("$aapt2" dump xmltree --file AndroidManifest.xml "$apk")"
          if grep -q "org.mozilla.gecko.crashhelper.CrashHelper" <<< "$manifest"; then echo "::error::the legacy APK still declares GeckoView's crash helper service"; exit 1; fi
          # Its icons load on Android 6: the Mirror's first start crashed on one that didn't (#198).
          python3 tools/legacy/apk-icons.py --aapt2 "$aapt2" "$apk" drawable/ic_notification
          echo "Legacy APK (arm64-v8a): $(stat -c %s "$apk") bytes" >> "$GITHUB_STEP_SUMMARY"

      - name: Size, change and budget
        run: |
          args=""
          for apk in "$RUNNER_TEMP"/generic/*.apk; do
            a="$(basename "$apk" .apk)"
            args="$args --apk $a=$apk"
            [ -f "$RUNNER_TEMP/generic-base/$a.apk" ] && args="$args --base-apk $a=$RUNNER_TEMP/generic-base/$a.apk"
          done
          while IFS= read -r m; do [ -n "$m" ] && args="$args --base-missing $m"; done < "$RUNNER_TEMP/generic-base/missing"
          base_budgets="$RUNNER_TEMP/generic-base/src/frames/generic-android/budgets.json"
          [ -f "$base_budgets" ] && args="$args --base-budgets $base_budgets"
          # shellcheck disable=SC2086 # $args is a list of options
          python3 tools/size/apksize.py report --frame generic-android $args \
            --json "$RUNNER_TEMP/generic/size.json" --md "$RUNNER_TEMP/generic/size.md"

      - name: Job summary
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/generic/size.md" ] && cat "$RUNNER_TEMP/generic/size.md" >> "$GITHUB_STEP_SUMMARY" || true

      # For size-comment.yml, next to the size job's apk-size (which says which PR).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && github.event_name == 'pull_request'
        with:
          name: apk-size-generic
          path: ${{ runner.temp }}/generic/size.json
          retention-days: 7
          if-no-files-found: ignore

      # So a failed run can't save a remembered "missing" artifact into the cache (docs/ci.md, Caches).
      - name: Forget Gradle's dependency metadata after a failure
        if: failure()
        run: rm -rf ~/.gradle/caches/modules-2/metadata-*


  branding:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.branding != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # One frame per runner (#536): one after the other they took 2.5 and 5.5 minutes, and side by side on one
    # runner 4.3 and 7.2 (the generator uses every core).
    strategy:
      fail-fast: false
      matrix:
        include:
          - frame: aqara-s1-plus
            out: branding/glass-tile
          - frame: lululemon-mirror
            out: branding/lululemon-mirror
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # The versions are the ones in branding/boot/README.md; the outputs are byte-identical on
      # macOS arm64 and in this image (checked 2026-11-13).
      - name: Rebuild the boot branding (${{ matrix.frame }})
        env:
          FRAME: ${{ matrix.frame }}
          OUT: ${{ matrix.out }}
        run: |
          docker run --rm -v "$PWD":/w -w /w -e FRAME -e OUT \
            python:3.11-slim@sha256:07d4824036af339fa1b6ef769cc99d9c10a141769538b52b3b597c84f7a7b535 sh -euc '
              apt-get -qq update && apt-get -qq install -y --no-install-recommends curl ca-certificates >/dev/null
              pip -q install --root-user-action=ignore pillow==13.0.0 numpy==2.4.6 uharfbuzz==0.57.0 pyoxipng==9.1.1
              python branding/boot/generate.py --frame "$FRAME" --out "$OUT"'

      # The whole of branding/, not only this frame's folder: the generator must write nothing else.
      - name: The committed files are what the generator writes
        run: |
          sudo chown -R "$(id -u):$(id -g)" branding
          git status --short -- branding
          git diff --exit-code --stat -- branding
          test -z "$(git status --porcelain -- branding)"

  site:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.site != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint -w site
      - name: Typecheck
        run: npm run typecheck -w site
      # Prerendering /blueprints reads GitHub's API, and a dropped connection there ("fetch failed: other side closed")
      # failed about one site run in seven on 2026-11-18 and 19. Then it builds once more; any other failure fails.
      - name: Builds as Vercel builds it
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/site-build.log"
          if npm run build -w site 2>&1 | tee "$log"; then exit 0; fi
          grep -q 'fetch failed' "$log" || exit 1
          echo "::warning::The site build lost a connection to GitHub's API (fetch failed). Building once more."
          npm run build -w site
        env:
          # The blueprints and the latest release read GitHub's Releases API. Unauthenticated, a shared runner
          # IP runs out of its 60 calls an hour (HTTP 403). The workflow's read-only token gets the higher limit.
          GITHUB_TOKEN: ${{ github.token }}
      - name: Each docs route carries the Markdown and images it renders
        run: npm run check:trace -w site
      - name: SEO check (sitemap, titles, descriptions, canonicals, preview images)
        run: npm run check:seo -w site
