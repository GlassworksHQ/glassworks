# Glassworks: night mode for the panels (#473). The panel has no clock-based schedule of its own: Home
# Assistant decides when it is night, and this sets each panel's Idle timeout and Max auto brightness
# (docs/esphome.md). The Screen page's blueprint: listed in
# core/src/main/java/dev/glassworks/screen/page.json, offered on the panel's Screen settings.
# Not yet run on a panel (2026-11-17).
#
# It checks once a minute. At night it moves a panel that is at the day value to the night value; by day,
# one at the night value back to the day value. So it acts once at each change of night, and a value set
# by hand (anything else) stays. The panel's own value is the memory: nothing is stored between runs, a
# Home Assistant restart in the night loses nothing, and a panel that was off catches up within a minute.
blueprint:
  name: Panel night mode
  description: >-
    At night the panels turn their screen off sooner and keep it dimmer. In the morning they go back to
    your day settings. Night is whatever you pick: between two times (22:00 to 07:00 to start with),
    from sunset to sunrise with a Sun condition, or any condition Home Assistant can check, like
    an alarm being armed. Pick each panel's Idle timeout and Max auto brightness; any number of panels
    works. It moves a panel between your day and night values only: a value you set by hand stays until
    you set it back. A panel that Home Assistant added before this blueprint has its Idle timeout entity
    off: enable it on the panel's device page first.
  domain: automation
  homeassistant:
    min_version: "2024.10.0"
  input:
    idle_timeouts:
      name: The panels' Idle timeout
      description: >-
        One per panel: number.<panel>_idle_timeout. The screen turns off after this long with nobody
        near and no touch. Only a panel's duration numbers are offered.
      selector:
        entity:
          multiple: true
          filter:
            - integration: esphome
              domain: number
              device_class: duration
    max_brightness:
      name: The panels' Max auto brightness (optional)
      description: >-
        One per panel: its "Max auto brightness", number.<panel>_max_auto_brightness, and nothing else. It
        limits how bright the screen gets while its brightness follows the room's light. Any other number
        is skipped (only this one is in %). Leave it empty to change only the idle timeout.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - integration: esphome
              domain: number
    night:
      name: Night is when
      description: >-
        The conditions that make it night; all of them must hold. Use a Time condition for two times, or
        a Sun condition (after sunset, before sunrise) for the sun.
      default:
        - condition: time
          after: "22:00:00"
          before: "07:00:00"
      selector:
        condition:
    night_idle:
      name: At night, turn off after
      description: The idle timeout at night.
      default: 20
      selector:
        number:
          min: 5
          max: 3600
          step: 5
          unit_of_measurement: s
    day_idle:
      name: By day, turn off after
      description: The idle timeout the rest of the time. 120 s is the panel's own default.
      default: 120
      selector:
        number:
          min: 0
          max: 3600
          step: 5
          unit_of_measurement: s
    night_brightness:
      name: At night, at most
      description: Max auto brightness at night.
      default: 20
      selector:
        number:
          min: 5
          max: 100
          step: 5
          unit_of_measurement: "%"
    day_brightness:
      name: By day, at most
      description: Max auto brightness the rest of the time. 100% is the panel's own default.
      default: 100
      selector:
        number:
          min: 5
          max: 100
          step: 5
          unit_of_measurement: "%"

mode: single
max_exceeded: silent

variables:
  idle_timeouts: !input idle_timeouts
  max_brightness: !input max_brightness
  night_idle: !input night_idle
  day_idle: !input day_idle
  night_brightness: !input night_brightness
  day_brightness: !input day_brightness

triggers:
  - trigger: time_pattern
    minutes: /1
  - trigger: homeassistant
    event: start

actions:
  - if: !input night
    then:
      - variables:
          idle_from: "{{ day_idle }}"
          idle_to: "{{ night_idle }}"
          brightness_from: "{{ day_brightness }}"
          brightness_to: "{{ night_brightness }}"
      - &apply
        sequence:
          # A panel that is there, of the right kind, and still at the other time's value. A value set by
          # hand is neither, so it stays; a panel already moved is at the new value, so nothing is written.
          - variables:
              idle_move: >-
                {% set ns = namespace(out=[]) %}
                {% for e in idle_timeouts if has_value(e) and state_attr(e, 'device_class') == 'duration'
                   and idle_from | float != idle_to | float and states(e) | float(-1) == idle_from | float %}
                {% set ns.out = ns.out + [e] %}
                {% endfor %}
                {{ ns.out }}
              brightness_move: >-
                {% set ns = namespace(out=[]) %}
                {% for e in max_brightness if has_value(e) and state_attr(e, 'unit_of_measurement') == '%'
                   and brightness_from | float != brightness_to | float and states(e) | float(-1) == brightness_from | float %}
                {% set ns.out = ns.out + [e] %}
                {% endfor %}
                {{ ns.out }}
          - if: "{{ idle_move | count > 0 }}"
            then:
              - action: number.set_value
                target:
                  entity_id: "{{ idle_move }}"
                data:
                  value: "{{ idle_to }}"
          - if: "{{ brightness_move | count > 0 }}"
            then:
              - action: number.set_value
                target:
                  entity_id: "{{ brightness_move }}"
                data:
                  value: "{{ brightness_to }}"
    else:
      - variables:
          idle_from: "{{ night_idle }}"
          idle_to: "{{ day_idle }}"
          brightness_from: "{{ night_brightness }}"
          brightness_to: "{{ day_brightness }}"
      - *apply
