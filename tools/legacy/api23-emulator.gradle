// The core's conformance test and the engine contract on Android 6 (#198, MIT): a Gradle init script for
// core-emulators.yml's API 23 jobs. It changes no build file: for this run only, every Android library builds at
// minSdk 23, as the legacy build runs them (frames/generic-android/android/src/legacy/AndroidManifest.xml overrides
// their floor), and the test APKs get core library desugaring, as the legacy build has it (java.time, Base64).
//
//   ./gradlew --init-script tools/legacy/api23-emulator.gradle :glassworks-core:connectedDebugAndroidTest
//   ./gradlew --init-script tools/legacy/api23-emulator.gradle -PengineConformanceGecko=legacy \
//       :engine-conformance:connectedDebugAndroidTest
//
// Touches only build outputs. :engine-gecko is left out: the current engine (GeckoView 159, API 26), which neither
// test uses on Android 6 (the core's engine is a fake, and the engine contract runs the legacy engine there).

// The modules whose test APK this run installs on Android 6.
def desugared = [':glassworks-core', ':engine-conformance']

allprojects { p ->
    if (p.path == ':engine-gecko') return
    p.plugins.withId('com.android.library') {
        p.androidComponents {
            finalizeDsl { ext ->
                ext.defaultConfig.minSdk = 23
                if (p.path in desugared) ext.compileOptions.coreLibraryDesugaringEnabled = true
            }
        }
        if (p.path in desugared) {
            // GPL-2.0 with the Classpath exception, as in the legacy build (THIRD-PARTY-NOTICES.md).
            p.dependencies.add('coreLibraryDesugaring', 'com.android.tools:desugar_jdk_libs:2.1.5')
        }
    }
}
